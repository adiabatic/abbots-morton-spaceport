        exit: 1
        require: {output: ["the kernel exited 1 on build-tables:", deep-class member mismatch, qsTea]}
        detail: {output: ["ss03+ss05: deep-class member mismatch at", "where the representative traced qsUtter.mono.en-y0 (junction none"]}
