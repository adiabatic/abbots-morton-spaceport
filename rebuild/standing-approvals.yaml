format: ams-standing-approvals/1
rules:
  - id: tea-oy-ligature-break
    verdict: approve
    note: "·X ~x~ ·Tea.half | ·Oy → ·X | ·Tea+Oy: never going to have a different opinion unless ·X is ·Out"
    match:
      before:
        pivot: qsTea.half
        seam_into: y5
        seam_out: break
        follower: qsOy
      after:
        ligature: qsTea_qsOy
        seam_into: break
      except_left: [qsOut]
  - id: tea-i-exit-extension-dropped
    verdict: approve
    note: "·I loops more tightly after ·Tea"
    match:
      before:
        pivot: qsTea
        exit_extension: ex-ext-1
        seam_out: y0
        follower: qsI
      after:
        pivot_cells:
          - qsTea/full/None/baseline/
          - qsTea/full/x-height/baseline/
        follower_cells:
          - qsI/smaller-loop/baseline/None/
          - qsI/smaller-loop/baseline/x-height/
          - qsI/smaller-loop/baseline/x-height/ex-ext-1
      except_left: []
  - id: may-entry-stub-dropped
    verdict: approve
    note: "Only differs from the old font because the ·May doesn't have a stub pixel on the left side of it anymore — already judged an OK change (the 1px attachment drift accepted at the qsAh and qsI sittings)"
    match:
      before:
        pivots: [qsMay.en-y5]
      after:
        pivots: [qsMay.loop]
        stub_drop: 1
      except_left: []
  - id: i-smaller-loop-after-baseline-entry
    verdict: approve
    note: "·I loops more tightly after a baseline entry — the smaller-loop-survives-extension override accepted at the qsI close"
    match:
      after:
        ink_deltas: [d-fb9cc0e103ca]
      except_left: []
  - id: see-grounded-left-column-dropped
    verdict: approve
    note: "The grounded ·See sits a column closer to whatever precedes it — one blank column on its left where the old font left two, the same tail on its right — and everything after it only slides over; ruled at the ·At sitting, where the ·See→·At placement delta was the parked question"
    match:
      before:
        pivots: [qsSee.ex-y0]
      after:
        pivots: [qsSee.straighter, qsSee.straightest]
        slide: -1
      except_left: []
  - id: jai-exit-extension-dropped
    verdict: approve
    note: "·Vie, ·See, ·No and ·Low sit a pixel closer to ·J’ai — the exit extension the old font drew before them came off ·J’ai’s extend record at the qsJai batch, and the tighter seam was approved in every window that reached a sitting"
    match:
      before:
        pivot: qsJai
        exit_extension: ex-ext-1
        seam_out: y0
        follower: [qsVie, qsVie_qsUtter, qsSee, qsNo, qsLow]
      after:
        pivot_cells:
          - qsJai/hapax/None/baseline/
          - qsJai/hapax/x-height/baseline/
          - qsJai/hapax/x-height/baseline/en-con-1
          - qsJai/hapax/x-height/baseline/en-con-2
        follower_cells:
          - qsVie/normal/baseline/None/
          - qsVie/swept-out/baseline/baseline/
          - qsVie_qsUtter/hapax/baseline/None/
          - qsVie_qsUtter/hapax/baseline/x-height/
          - qsVie_qsUtter/hapax/baseline/x-height/ex-ext-1
          - qsSee/normal/baseline/None/
          - qsSee/normal/baseline/top/
          - qsSee/curled-over/baseline/y6/
          - qsNo/flipped/baseline/None/
          - qsNo/flipped/baseline/baseline/
          - qsLow/hapax/baseline/None/
          - qsLow/hapax/baseline/x-height/
          - qsLow/hapax/baseline/x-height/ex-ext-1
      except_left: []
  - id: fee-tea-ss03-exit-extension-shortened
    verdict: approve
    note: "Under ss03, ·Fee reaches ·Tea with a one-pixel extension where the old font drew the three-pixel one it had made for ·May — the rune extends by 1 per the old derive’s stated intent (the deliberate ss03 ·Fee·Tea divergence, on ·Fee’s extend record since the qsFee batch), and every window that reached a sitting approved the shorter reach"
    match:
      before:
        pivot: qsFee
        exit_extension: ex-ext-3
        seam_out: y5
        follower: qsTea
      after:
        pivot_cells:
          - qsFee/loop/None/x-height/ex-ext-1
        follower_cells:
          - qsTea/full/x-height/None/
          - qsTea/full/x-height/baseline/
      except_left: []
  - id: fee-tea-ss03-join-restored
    verdict: approve
    note: "Under ss03, ·Fee ~x~ ·Tea replaces the old pipeline's break after qsFee.ex-y5.before-may.ex-ext-3, using the same one-pixel reach already approved by fee-tea-ss03-exit-extension-shortened; qsFee policy.prefer[0] records the intended forward join"
    match:
      before:
        pivot: qsFee.ex-y5.before-may.ex-ext-3
        seam_out: break
        follower: qsTea
      after:
        joined: y5
        pivot_cells:
          - qsFee/loop/None/x-height/ex-ext-1
        receiver_cells:
          - qsTea/full/x-height/None/
          - qsTea/full/x-height/baseline/
        shift: -3
      except_left: []
  - id: et-may-exit-contracted
    verdict: approve
    note: "·May sits a pixel closer to ·Et — the extra pixel of exit the old font drew came off as a contraction on ·Et’s contract record, and every window that reached a sitting approved the shorter reach"
    match:
      before:
        pivot: qsEt
        exit_extension: ex-con-1
        seam_out: y0
        follower: qsMay
      after:
        pivot_cells:
          - qsEt/hapax/None/baseline/ex-con-1
          - qsEt/hapax/x-height/baseline/ex-con-1
          - qsEt/hapax/x-height/baseline/en-ext-1+ex-con-1
        follower_cells:
          - qsMay/loop/baseline/None/
          - qsMay/loop/baseline/x-height/ex-ext-1
          - qsMay/loop/baseline/x-height/ex-ext-2
      except_left: []
  - id: roe-baseline-bar-kept-after-it
    verdict: approve
    note: "The bottom of ·Roe sits a pixel closer to ·It — the hapax keeps the baseline bar the old font’s shortened-bottom x-height-entry-extended variant omitted; approved at the qsRoe sitting"
    match:
      before:
        pivots: [qsRoe.en-ext-1-at-5]
      after:
        pivots: [qsRoe.hapax]
        gained: [[1, 0]]
        shift: 0
      except_left: []
  - id: at-it-xheight-join-dropped
    verdict: approve
    note: "·It sits a column further from ·At — they no longer join at the x-height; ·At's x-height-exit refusal before ·It was authored as “Don’t join ·At·It either”, and every window that reached a sitting approved the break"
    match:
      before:
        pivot: qsAt
        seam_out: y5
        follower: qsIt
      after:
        gap: 1
      except_left: []
  - id: it-et-xheight-join-dropped
    verdict: approve
    note: "·Et sits a column further from ·It — they no longer join at the x-height; qsIt's x-height-exit refusal before ·Et was authored as “Don't join ·It·Et (it looks kind of ugly)”, and every window that reached a sitting approved the break"
    match:
      before:
        pivot: qsIt
        seam_out: y5
        follower: qsEt
      after:
        gap: 1
      except_left: []
  - id: see-low-entry-extension-dropped
    verdict: approve
    note: "·Low sits a pixel closer to ·See — the extra pixel of baseline entry the old font drew after ·See is a composed extension the rebuild does not sum with ·See's two-pixel exit, and every window that reached a sitting approved the shorter reach"
    match:
      before:
        pivots: [qsLow.en-ext-1]
      after:
        pivots: [qsLow.hapax]
        entry_drop: 1
      except_left: []
  - id: vie-entry-extension-dropped
    verdict: approve
    note: "·Vie sits a pixel closer after ·Pea, ·Tea and ·It — the extra pixel of baseline entry the old font drew came off qsVie's extend record (ditched for ·It, then ·Tea, then ·Pea), and every window that reached a sitting approved the shorter reach"
    match:
      before:
        pivots: [qsVie.en-ext-1, qsVie.en-y0.ex-y0.en-ext-1]
      after:
        pivots: [qsVie.normal, qsVie.swept-out]
        entry_drop: 1
      except_left: []
  - id: vie-utter-entry-extension-dropped
    verdict: approve
    note: "·Vie+Utter sits a pixel closer after ·Pea, ·Tea and ·It — the extra pixel of baseline entry the old font drew came off the ligature's extend record in the same three ditches as bare ·Vie, and every window that reached a sitting approved the shorter reach"
    match:
      before:
        pivots: [qsVie_qsUtter.en-ext-1]
      after:
        pivots: [qsVie_qsUtter.hapax]
        entry_drop: 1
      except_left: []
  - id: may-entry-extension-dropped
    verdict: approve
    note: "·May sits a pixel closer after ·Pea — the extra pixel of baseline entry the old font drew came off qsMay's extend record (Never lengthen ·May's baseline-entry join), and every window that reached a sitting approved the shorter reach"
    match:
      before:
        pivots: [qsMay.en-y0.ex-y5.en-ext-1]
      after:
        pivots: [qsMay.loop, qsMay.grounded-loop]
        entry_drop: 1
      except_left: []
  - id: bay-may-entry-contracted
    verdict: approve
    note: "·May sits a pixel closer after ·Bay — its baseline entry contracts by one column under the ·Bay-specific contract record introduced by “Have only one pixel of separation in ·Bay·May, not two”"
    match:
      before:
        left: qsBay
        pivots: [qsMay.en-y0.ex-y5]
      after:
        pivots: [qsMay.loop.en-y0.en-con-1, qsMay.loop.en-y0.ex-y5.en-con-1]
        entry_contraction: 1
      except_left: []
  - id: tea-no-xheight-join-retargeted
    verdict: approve
    note: "·Tea sits as the full bar joining ·No at the baseline — the old font drew the half stub joining at the x-height; qsNo's flipped stance takes ·Tea on its baseline from-list, and every window that reached a sitting approved the lowered join"
    match:
      before:
        pivot: qsTea.half
        seam_out: y5
        follower: qsNo
      after:
        retarget: y0
        pivot_cells:
          - qsTea/full/None/baseline/
          - qsTea/full/x-height/baseline/
          - qsTea/full/top/baseline/
        receiver_cells:
          - qsNo/flipped/baseline/None/
          - qsNo/flipped/baseline/baseline/
        shift: -1
      except_left: []
  - id: pea-no-xheight-join-retargeted
    verdict: approve
    note: "·Pea sits as the full bar joining ·No at the baseline — the old font drew the half stub joining at the x-height; qsNo's flipped stance takes ·Pea on its baseline from-list, and every window that reached a sitting approved the lowered join"
    match:
      before:
        pivot: qsPea.half
        seam_out: y5
        follower: qsNo
      after:
        retarget: y0
        pivot_cells:
          - qsPea/full/None/baseline/
          - qsPea/full/x-height/baseline/
          - qsPea/full/y6/baseline/
        receiver_cells:
          - qsNo/flipped/baseline/None/
          - qsNo/flipped/baseline/baseline/
        shift: -1
      except_left: []
  - id: it-may-exit-extension-dropped
    verdict: approve
    note: "·Vie, ·May, ·Low and ·Utter sit a pixel closer to an entered ·It — the extra pixel of exit the old font drew came off qsIt's entered baseline-exit extend (they sit on the except list; ·It·Vie was ditched outright), and every window that reached a sitting approved the shorter reach"
    match:
      before:
        pivot: qsIt
        exit_extension: ex-ext-1
        seam_out: y0
        follower: [qsVie, qsVie_qsUtter, qsMay, qsLow, qsUtter]
      after:
        pivot_cells:
          - qsIt/hapax/None/baseline/
          - qsIt/hapax/baseline/baseline/
          - qsIt/hapax/x-height/baseline/
        follower_cells:
          - qsVie/normal/baseline/None/
          - qsVie/swept-out/baseline/baseline/
          - qsVie_qsUtter/hapax/baseline/None/
          - qsMay/loop/baseline/None/
          - qsMay/loop/baseline/x-height/ex-ext-1
          - qsMay/loop/baseline/x-height/ex-ext-2
          - qsLow/hapax/baseline/None/
          - qsLow/hapax/baseline/x-height/
          - qsLow/hapax/baseline/x-height/ex-ext-1
          - qsUtter/mono/baseline/None/
          - qsUtter/mono/baseline/x-height/
          - qsUtter/mono/baseline/x-height/ex-ext-1
      except_left: []
  - id: it-ah-exit-extension-dropped
    verdict: approve
    note: "·At and ·Ah sit a pixel closer to ·It — the extra pixel of exit the old font drew came off once ·It lost the live x-height entry qsIt's baseline-exit extend requires, and every window that reached a sitting approved the shorter reach"
    match:
      before:
        pivot: qsIt
        exit_extension: ex-ext-1
        seam_out: y0
        follower: [qsAt, qsAh]
      after:
        pivot_cells:
          - qsIt/hapax/None/baseline/
          - qsIt/hapax/baseline/baseline/
        follower_cells:
          - qsAt/rising/baseline/None/
          - qsAt/rising/baseline/x-height/
          - qsAh/hapax/baseline/None/
          - qsAh/hapax/baseline/x-height/
          - qsAh/hapax/baseline/x-height/ex-ext-1
      except_left: []
  - id: eight-smaller-loop
    verdict: approve
    note: "·Eight's bowl pulls in one column where its baseline exit joins ·Tea or ·It, so the bowl no longer rubs the riser — the smaller-loop stance mirrors ·I's, authored as “Give ·Eight a smaller loop before ·Tea and ·It, mirroring ·I's”, and every window that reached a sitting approved the tighter bowl"
    match:
      before:
        pivots: [qsEight]
      after:
        pivots: [qsEight.smaller-loop]
        dropped: [[3, 3], [3, 5], [4, 4]]
        added: [[3, 4]]
        shift: 0
      except_left: []
  - id: eight-smaller-loop-exit-extension-dropped
    verdict: approve
    note: "·It sits a pixel closer to ·Eight's smaller loop — the old +1 connector extension at the baseline seam went away in the same stroke as the bowl, which keeps the gap under ·Eight's rightmost pixel just below the x-height, and every window that reached a sitting approved the shorter reach"
    match:
      before:
        pivots: [qsEight.ex-ext-1, qsEight.noentry.ex-ext-1]
      after:
        pivots: [qsEight.smaller-loop]
        dropped: [[3, 3], [3, 5], [4, 4], [5, 0]]
        added: [[3, 4]]
        shift: -1
      except_left: []
  - id: eight-tea-entry-extension-dropped
    verdict: approve
    note: "·Tea sits a pixel closer to ·Eight — the extra pixel of baseline entry the old font drew after ·Eight came off qsTea's extend record in the same stroke as ·Eight's smaller loop, and every window that reached a sitting approved the shorter reach"
    match:
      before:
        pivots: [qsTea.en-y0.en-ext-1]
      after:
        pivots: [qsTea.full.en-y0]
        entry_drop: 1
      except_left: []
  - id: i-smaller-loop
    verdict: approve
    note: "·I loops more tightly after a baseline join — the smaller-loop prefer on qsI carries the recorded why (the tighter bowl doesn't rub the letter it follows), and every window that reached a sitting approved it"
    match:
      before:
        pivots: [qsI]
      after:
        pivots: [qsI.smaller-loop]
        dropped: [[0, 4], [1, 3], [1, 5]]
        added: [[1, 4]]
        shift: 0
      except_left: []
  - id: i-regular-loop-after-roe
    verdict: approve
    note: "·I opens back up to its regular loop after ·Roe — the old font's smaller loop was rejected there by verdict (Give ·I its regular loop again after ·Roe, carried as a comment on qsI's prefer), and every window that reached a sitting approved the regular bowl"
    match:
      before:
        pivots: [qsI.en-y0.ex-y5.smaller-loop]
      after:
        pivots: [qsI.loop]
        dropped: [[1, 4]]
        added: [[0, 4], [1, 3], [1, 5]]
        shift: 0
      except_left: []
  - id: roe-xheight-arm-kept-after-eight
    verdict: approve
    note: "The top of ·Roe reaches a pixel further toward ·Eight — the hapax keeps the x-height arm the old font's shortened-top variant cut back whenever it extended the baseline entry, mirroring the baseline bar roe-baseline-bar-kept-after-it restores at the other tip, and every window that reached a sitting approved the longer arm"
    match:
      before:
        pivots: [qsRoe.en-ext-1-at-0]
      after:
        pivots: [qsRoe.hapax.en-y0.en-ext-1]
        gained: [[1, 5]]
        shift: 0
      except_left: []
  - id: roe-baseline-bar-kept-entry-extension-dropped
    verdict: approve
    note: "·Roe sits a pixel closer to ·May and keeps its baseline bar in the same stroke — the rebuild does not sum ·Roe's x-height entry extension onto ·May's own already-extended exit, and the hapax it settles into keeps the bar the old font's shortened-bottom variant cut back, and every window that reached a sitting approved the tighter seam and the fuller bar"
    match:
      before:
        pivots: [qsRoe.en-ext-1-at-5]
      after:
        pivots: [qsRoe.hapax.en-y5]
        dropped: [[3, 0], [3, 5], [4, 1], [4, 4], [5, 2], [5, 3]]
        added: [[0, 0], [1, 0], [3, 1], [3, 4], [4, 2], [4, 3]]
        shift: -1
      except_left: []
  - id: roe-baseline-exit-entry-extension-dropped
    verdict: approve
    note: "·Roe sits a pixel closer to ·May when it carries a baseline exit of its own — the same refusal to sum ·Roe's x-height entry extension onto ·May's already-extended exit that roe-baseline-bar-kept-entry-extension-dropped records for the exitless form (“Stop bothering me about ·Roe’s new shape after ·May”), except that the exit-bearing form already draws the full baseline bar, so the entry column coming off is the whole change, and every window that reached a sitting approved the tighter seam"
    match:
      before:
        pivots: [qsRoe.ex-y0.en-ext-1-at-5]
      after:
        pivots: [qsRoe.hapax.en-y5.ex-y0]
        entry_drop: 1
      except_left: []
  - id: tea-full-bar-after-xheight-stroke-ss03
    verdict: approve
    note: "·Tea keeps the full-height bar after a flat x-height stroke under ss03, including after ·May — the standing decision is recorded by qsTea's ss03 unlock and “Always draw ·Tea's full bar after a flat x-height stroke under ss03”"
    match:
      before:
        pivots: [qsTea.half.en-y5.after-xheight-exit]
      after:
        pivots: [qsTea.full]
        gained: [[0, 0], [0, 1], [0, 2], [0, 3], [0, 4]]
        shift: 0
      except_left: []
  - id: key-exit-contracted
    verdict: approve
    note: "·May, ·No and ·It sit a pixel closer to ·Key — the extra pixel of exit the old font drew came off as a contraction on ·Key’s contract record, authored as “Contract by a pixel between ·Key·{May,No,It}”, and every window that reached a sitting approved the shorter reach"
    match:
      before:
        pivots: [qsKey]
      after:
        pivots: [qsKey.hapax.ex-y0.ex-con-1, qsKey.hapax.en-y8.ex-y0.ex-con-1]
        dropped: [[3, 0]]
        added: []
        shift: -1
      except_left: []
  - id: et-pea-baseline-join-created
    verdict: approve
    note: "·Pea takes the full bar on a baseline entry and closes four columns onto ·Et, where the old font left a break — qsPea's full stance has carried ·Et on its baseline entry from-list since the rune migration, and the join went live when ·Et joined the alphabet (“Declare ·Roe done and add ·Et”); every window that reached a sitting approved it"
    match:
      before:
        pivot: qsEt
        seam_out: break
        follower: qsPea
      after:
        joined: y0
        pivot_cells:
          - qsEt/hapax/None/baseline/
          - qsEt/hapax/x-height/baseline/
          - qsEt/hapax/x-height/baseline/en-ext-1
        receiver_cells:
          - qsPea/full/baseline/None/
        shift: -4
      except_left: []
  - id: gay-no-xheight-extension-added
    verdict: approve
    note: "·Gay gains one pixel of x-height exit into ·No and carries ·No one column right — qsGay's extend record says “Add a pixel of extension for `·Gay ~x~ ·No` and make them join — I can't see why they can't join”, landed in “Join ·Gay ~x~ ·Et and ·Gay ~x~ ·No”"
    match:
      before:
        pivots: [qsGay.ex-y5, qsGay.en-y0.ex-y5]
      after:
        pivots: [qsGay.hapax]
        gained: [[4, 8]]
        shift: 1
      except_left: []
  - id: gay-entry-contracted
    verdict: approve
    note: "·Gay's baseline entry pulls in one pixel after ·Bay, ·Day, ·Key, ·No, ·Et and ·Awe — every one of those pair rulings sits on qsGay's contract record, each landed under its own “Contract … by a pixel” commit, ·Day and ·Awe in “Contract ·{Day,Awe} ~b~ ·Gay by a pixel”"
    match:
      before:
        left: [qsBay, qsDay, qsKey, qsNo, qsEt, qsAwe]
        pivots: [qsGay.en-y0.ex-y5]
      after:
        pivots:
          - qsGay.hapax.en-y0.en-con-1
          - qsGay.hapax.en-y0.ex-y5.en-con-1
        entry_contraction: 1
      except_left: []
  - id: et-gay-exit-contracted
    verdict: approve
    note: "·Gay sits a pixel closer to ·Et from ·Et's side — qsEt's baseline exit contracts by one under its ·Gay-specific contract record; qsGay's paired entry contraction supplies the second pixel"
    match:
      before:
        pivot: qsEt
        exit_extension: ex-con-1
        seam_out: y0
        follower: qsGay
      after:
        pivot_cells:
          - qsEt/hapax/None/baseline/ex-con-1
          - qsEt/hapax/x-height/baseline/en-ext-1+ex-con-1
          - qsEt/hapax/x-height/baseline/ex-con-1
        follower_cells:
          - qsGay/hapax/baseline/None/en-con-1
          - qsGay/hapax/baseline/x-height/en-con-1
          - qsGay/hapax/baseline/x-height/en-con-1+ex-ext-3
      except_left: []
  - id: ah-entry-contracted-after-jai
    verdict: approve
    note: "·Ah's baseline entry pulls in one pixel after ·J’ai — qsAh's contract record was authored as “Contract ·J’ai ~b~ ·Ah by a pixel”"
    match:
      before:
        left: qsJai
        pivots: [qsAh]
      after:
        pivots:
          - qsAh.hapax.en-y0.en-con-1
          - qsAh.hapax.en-y0.ex-y5.en-con-1
        entry_contraction: 1
      except_left: []
  - id: ah-bay-exit-extension-dropped
    verdict: approve
    note: "·Bay sits a pixel closer to ·Ah — the extra pixel of x-height exit came off qsAh's extend record in “Stop extending ·Ah ~x~ ·{Bay,Fee} by a pixel”"
    match:
      before:
        pivot: qsAh
        exit_extension: ex-ext-1
        seam_out: y5
        follower: qsBay
      after:
        pivot_cells:
          - qsAh/hapax/None/x-height/
          - qsAh/hapax/baseline/x-height/
          - qsAh/hapax/baseline/x-height/en-con-1
        follower_cells:
          - qsBay/hapax/x-height/None/
          - qsBay/hapax/x-height/baseline/
      except_left: []
  - id: jai-entry-contracted-exit-extension-dropped
    verdict: approve
