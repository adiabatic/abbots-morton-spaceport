format: ams-standing-approvals/1
rules:
  - id: tea-oy-ligature-break
    verdict: approve
    note: "·X ~x~ ·Tea.half | ·Oy → ·X | ·Tea+Oy: never going to have a different opinion unless ·X is ·Out"
    match:
      before:
        pivot: qsTea.half
        seam_into: y5
        seam_out: break
        follower: qsOy
      after:
        ligature: qsTea_qsOy
        seam_into: break
      except_left: [qsOut]
  - id: tea-i-exit-extension-dropped
    verdict: approve
    note: "·I loops more tightly after ·Tea"
    match:
      before:
        pivot: qsTea
        exit_extension: ex-ext-1
        seam_out: y0
        follower: qsI
      after:
        pivot_cells:
          - qsTea/full/None/baseline/
          - qsTea/full/x-height/baseline/
        follower_cells:
          - qsI/smaller-loop/baseline/None/
          - qsI/smaller-loop/baseline/x-height/
          - qsI/smaller-loop/baseline/x-height/ex-ext-1
      except_left: []
  - id: may-entry-stub-dropped
    verdict: approve
    note: "Only differs from the old font because the ·May doesn't have a stub pixel on the left side of it anymore — already judged an OK change (the 1px attachment drift accepted at the qsAh and qsI sittings)"
    match:
      after:
        ink_deltas: [d-14c0f8d9cc8c]
      except_left: []
  - id: i-smaller-loop-after-baseline-entry
    verdict: approve
    note: "·I loops more tightly after a baseline entry — the smaller-loop-survives-extension override accepted at the qsI close"
    match:
      after:
        ink_deltas: [d-fb9cc0e103ca]
      except_left: []
  - id: see-grounded-left-column-dropped
    verdict: approve
    note: "The grounded ·See sits a column closer to whatever precedes it — one blank column on its left where the old font left two, the same tail on its right — and everything after it only slides over; ruled at the ·At sitting, where the ·See→·At placement delta was the parked question"
    match:
      before:
        pivots: [qsSee.ex-y0]
      after:
        pivots: [qsSee.straighter, qsSee.straightest]
        slide: -1
      except_left: []
  - id: jai-exit-extension-dropped
    verdict: approve
    note: "·Vie, ·See, ·No and ·Low sit a pixel closer to ·J’ai — the exit extension the old font drew before them came off ·J’ai’s extend record at the qsJai batch, and the tighter seam was approved in every window that reached a sitting"
    match:
      before:
        pivot: qsJai
        exit_extension: ex-ext-1
        seam_out: y0
        follower: [qsVie, qsVie_qsUtter, qsSee, qsNo, qsLow]
      after:
        pivot_cells:
          - qsJai/hapax/None/baseline/
          - qsJai/hapax/x-height/baseline/
          - qsJai/hapax/x-height/baseline/en-con-1
          - qsJai/hapax/x-height/baseline/en-con-2
        follower_cells:
          - qsVie/normal/baseline/None/
          - qsVie/swept-out/baseline/baseline/
          - qsVie_qsUtter/hapax/baseline/None/
          - qsVie_qsUtter/hapax/baseline/x-height/
          - qsVie_qsUtter/hapax/baseline/x-height/ex-ext-1
          - qsSee/normal/baseline/None/
          - qsSee/normal/baseline/top/
          - qsSee/curled-over/baseline/y6/
          - qsNo/flipped/baseline/None/
          - qsNo/flipped/baseline/baseline/
          - qsLow/hapax/baseline/None/
          - qsLow/hapax/baseline/x-height/
          - qsLow/hapax/baseline/x-height/ex-ext-1
      except_left: []
  - id: fee-tea-ss03-exit-extension-shortened
    verdict: approve
    note: "Under ss03, ·Fee reaches ·Tea with a one-pixel extension where the old font drew the three-pixel one it had made for ·May — the rune extends by 1 per the old derive’s stated intent (the deliberate ss03 ·Fee·Tea divergence, on ·Fee’s extend record since the qsFee batch), and every window that reached a sitting approved the shorter reach"
    match:
      before:
        pivot: qsFee
        exit_extension: ex-ext-3
        seam_out: y5
        follower: qsTea
      after:
        pivot_cells:
          - qsFee/loop/None/x-height/ex-ext-1
        follower_cells:
          - qsTea/full/x-height/None/
          - qsTea/full/x-height/baseline/
      except_left: []
  - id: et-may-exit-contracted
    verdict: approve
    note: "·May sits a pixel closer to ·Et — the extra pixel of exit the old font drew came off as a contraction on ·Et’s contract record, and every window that reached a sitting approved the shorter reach"
    match:
      before:
        pivot: qsEt
        exit_extension: ex-con-1
        seam_out: y0
        follower: qsMay
      after:
        pivot_cells:
          - qsEt/hapax/None/baseline/ex-con-1
          - qsEt/hapax/x-height/baseline/ex-con-1
          - qsEt/hapax/x-height/baseline/en-ext-1+ex-con-1
        follower_cells:
          - qsMay/loop/baseline/None/
          - qsMay/loop/baseline/x-height/ex-ext-1
          - qsMay/loop/baseline/x-height/ex-ext-2
      except_left: []
  - id: roe-baseline-bar-kept-after-it
    verdict: approve
    note: "The bottom of ·Roe sits a pixel closer to ·It — the hapax keeps the baseline bar the old font’s shortened-bottom x-height-entry-extended variant omitted; approved at the qsRoe sitting"
    match:
      before:
        pivots: [qsRoe.en-ext-1-at-5]
      after:
        pivots: [qsRoe.hapax]
        gained: [[1, 0]]
      except_left: []
  - id: at-it-xheight-join-dropped
    verdict: approve
    note: "·It sits a column further from ·At — they no longer join at the x-height; ·At's x-height-exit refusal before ·It was authored as “Don’t join ·At·It either”, and every window that reached a sitting approved the break"
    match:
      before:
        pivot: qsAt
        seam_out: y5
        follower: qsIt
      after:
        gap: 1
      except_left: []
  - id: see-low-entry-extension-dropped
    verdict: approve
    note: "·Low sits a pixel closer to ·See — the extra pixel of baseline entry the old font drew after ·See is a composed extension the rebuild does not sum with ·See's two-pixel exit, and every window that reached a sitting approved the shorter reach"
    match:
      before:
        pivots: [qsLow.en-ext-1]
      after:
        pivots: [qsLow.hapax]
        entry_drop: 1
      except_left: []
  - id: vie-entry-extension-dropped
    verdict: approve
    note: "·Vie sits a pixel closer after ·Pea, ·Tea and ·It — the extra pixel of baseline entry the old font drew came off qsVie's extend record (ditched for ·It, then ·Tea, then ·Pea), and every window that reached a sitting approved the shorter reach"
    match:
      before:
        pivots: [qsVie.en-ext-1, qsVie.en-y0.ex-y0.en-ext-1]
      after:
        pivots: [qsVie.normal, qsVie.swept-out]
        entry_drop: 1
      except_left: []
  - id: vie-utter-entry-extension-dropped
    verdict: approve
    note: "·Vie+Utter sits a pixel closer after ·Pea, ·Tea and ·It — the extra pixel of baseline entry the old font drew came off the ligature's extend record in the same three ditches as bare ·Vie, and every window that reached a sitting approved the shorter reach"
    match:
      before:
        pivots: [qsVie_qsUtter.en-ext-1]
      after:
        pivots: [qsVie_qsUtter.hapax]
        entry_drop: 1
      except_left: []
  - id: tea-no-xheight-join-retargeted
    verdict: approve
    note: "·Tea sits as the full bar joining ·No at the baseline — the old font drew the half stub joining at the x-height; qsNo's flipped stance takes ·Tea on its baseline from-list, and every window that reached a sitting approved the lowered join"
    match:
      before:
        pivot: qsTea.half
        seam_out: y5
        follower: qsNo
      after:
        retarget: y0
        pivot_cells:
          - qsTea/full/None/baseline/
          - qsTea/full/x-height/baseline/
          - qsTea/full/top/baseline/
        receiver_cells:
          - qsNo/flipped/baseline/None/
          - qsNo/flipped/baseline/baseline/
        shift: -1
      except_left: []
  - id: pea-no-xheight-join-retargeted
    verdict: approve
    note: "·Pea sits as the full bar joining ·No at the baseline — the old font drew the half stub joining at the x-height; qsNo's flipped stance takes ·Pea on its baseline from-list, and every window that reached a sitting approved the lowered join"
    match:
      before:
        pivot: qsPea.half
        seam_out: y5
        follower: qsNo
      after:
        retarget: y0
        pivot_cells:
          - qsPea/full/None/baseline/
          - qsPea/full/x-height/baseline/
          - qsPea/full/y6/baseline/
        receiver_cells:
          - qsNo/flipped/baseline/None/
          - qsNo/flipped/baseline/baseline/
        shift: -1
      except_left: []
  - id: it-may-exit-extension-dropped
    verdict: approve
    note: "·Vie, ·May and ·Utter sit a pixel closer to an entered ·It — the extra pixel of exit the old font drew came off qsIt's entered baseline-exit extend (they sit on the except list; ·It·Vie was ditched outright), and every window that reached a sitting approved the shorter reach"
    match:
      before:
        pivot: qsIt
        exit_extension: ex-ext-1
        seam_out: y0
        follower: [qsVie, qsVie_qsUtter, qsMay, qsUtter]
      after:
        pivot_cells:
          - qsIt/hapax/None/baseline/
          - qsIt/hapax/baseline/baseline/
          - qsIt/hapax/x-height/baseline/
        follower_cells:
          - qsVie/normal/baseline/None/
          - qsVie/swept-out/baseline/baseline/
          - qsVie_qsUtter/hapax/baseline/None/
          - qsMay/loop/baseline/None/
          - qsMay/loop/baseline/x-height/ex-ext-1
          - qsMay/loop/baseline/x-height/ex-ext-2
          - qsUtter/mono/baseline/None/
          - qsUtter/mono/baseline/x-height/
          - qsUtter/mono/baseline/x-height/ex-ext-1
      except_left: []
  - id: it-ah-exit-extension-dropped
    verdict: approve
    note: "·Ah sits a pixel closer to ·It — the extra pixel of exit the old font drew came off once ·It lost the live x-height entry qsIt's baseline-exit extend requires, and every window that reached a sitting approved the shorter reach"
    match:
      before:
        pivot: qsIt
        exit_extension: ex-ext-1
        seam_out: y0
        follower: qsAh
      after:
        pivot_cells:
          - qsIt/hapax/None/baseline/
          - qsIt/hapax/baseline/baseline/
        follower_cells:
          - qsAh/hapax/baseline/None/
          - qsAh/hapax/baseline/x-height/
          - qsAh/hapax/baseline/x-height/ex-ext-1
      except_left: []
