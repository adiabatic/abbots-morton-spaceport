# Hand-written alias map for the M1 oracle comparison (M1-PLAN section 6, step 2(c)): every old compiled glyph name in any subset baseline row, mapped to the CellId the name denotes.
# This file can be deleted once the rebuild replaces the old font.
# Conventions: a bare family name denotes the isolated drawing with no committed anchors. The old font also joins on the bare glyph when its base drawing already has the live anchor; those rows match the bare-name-live-join ledger class at name grain. A suffixed name denotes the anchors it names, including anchors the old font leaves dangling at word edges; those rows match dangling-anchor-dropped. A `.noentry` name is one of the old font's post-ZWNJ variants and denotes the locked copy. A `.ss10` name is the old font's ss10 copy of the bare glyph, the same drawing and advance with no anchors, and denotes what the bare name denotes. Boundary glyph names map to the literal string `boundary`, and the comparison skips them.
# run_m1 checks completeness before it builds: a glyph name in a subset row with no entry here stops the run with an error listing the missing names. An entry may map to the literal string `pending` to acknowledge a name mid-migration: the completeness check accepts it, and the comparison still treats those rows as unaliased.

space: boundary
periodcentered: boundary
periodcentered.lowered: boundary

