    The batch-11 ruling ("do what ·Tea·Oy does"): ·Out+Tea always forms. M1 formation is config-blind by design — the ss marker substitutions stage after formation exactly so that enabling a set cannot un-form a ligature — while the old font's ss03 splits the pair apart (its calt substitutes the half-·Tea forward variant before its ligature pass runs, the `_LIGATURES_ALLOWING_SECOND_COMPONENT_FWD_VARIANTS` carve-out), rendering ·Out ~x~ ·Tea.half wherever half-·Tea can carry the join, forming the ligature anyway when a second ·Tea follows, and in the one deeper wrinkle breaking the pair entirely in ·See·Out·Tea·Tea. No config-blind transcription can hold both arms, and the default-config arm is the one the ligature exists for, so the rebuild keeps the ligature under ss03 too, and this class absorbs every ss03/ss03+ss05 window with a formable E67B:E652 adjacency that diverges at ligation grain. The always-form verdict is realized by qsTea's two exit refusals keyed on an unjoined ·Out left — a context only the formation guard's trail simulation can produce, since mid-run ·Out·Tea always forms — which defuse the section 5.7 guard that would otherwise un-form the exitless ligature before every follower an unformed ·Tea could reach. The retired old renderings are the deliberate ss03 ·Fee·Tea divergence's sibling, ruled wholesale rather than window by window, so the class carries no_verdict: no unit in it ever needs an individual verdict.
