    The old font extends ·Vie's baseline entry by one pixel after ·It, after ·Tea, after the ·Tea·Oy ligature (by lead expansion) and after ·Pea. The ·Vie-side entry extends name none of those four, so the rebuild draws each of those baseline joins one pixel tighter. The qsVie review session (2026-08-13) decided this from the rendered windows, one left letter at a time. For each left letter shown, the reviewer asked for the shorter junction, and no ·Vie-side record can shorten it for one left letter alone, because `when.left` reads the left cell, whose `joined_at` is the junction in question. So the pixel came off for all of those left letters together, and the option of moving it onto the left letter's own record was dropped with it. ·Pea followed at the qsEight review session (2026-08-22), where the reviewer's note on ·Pea·Vie·See·Out asked for the same junction ("the new ways is an improvement but I want ·Pea·Vie to have the same lack of extra space between the two as ·Tea·Vie"), so qsPea came off the three extend lists, which name only qsYe and qsHe. The class covers the ·Vie·Utter ligature's token as well as ·Vie's own, so the ·X·Vie·Utter rows match here too. The qsIt, qsVie and qsVie_qsUtter runes carry the decision. `no_verdict` because the ruling applies to the junction, not to any one window: a left letter that reaches this class in a later alphabet gets the same answer, and queueing it again would ask a settled question. ·It-side rows where the old font drew an exit extension beside ·Vie are a separate kind of change and stay unmatched: the classifier keeps any row with `-ex-ext-1` out of the name-grain classes.

