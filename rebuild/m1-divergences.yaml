# The M1 divergence ledger (M1-PLAN section 6): one entry per reviewed class of divergence between settlement and the section 13.1 baseline oracle, over the letters in `baseline_subset.M1_ALPHABET`.
# Every divergent row should match exactly one entry. A row that matches two or more fails the run_m1 gate; a row that matches none is unmatched, and the review corpus lists it under a change group. An entry's `match.predicate` names an oracle predicate (`oracle.PREDICATES`), whose name need not be the entry's id, and `oracle.classify_divergence` is the authority on which class a row's divergence tags pick and in what precedence. The run never writes this file: `counts_by_entry` in rebuild/out/m1/oracle_summary.json gives each class's row count, and rebuild/out/m1/divergence-audit.tsv holds the per-row detail.
# `status` takes a value from `audit.LEDGER_STATUSES`, which says what each means, and `audit.class_section` places the class in the review app from its status and unit counts. `title`, `summary` and the optional `note` are the class's copy in the review app and `why` its full rationale; `audit.load_ledger` refuses an entry without a title or summary. `ink_identical: true` claims that every unit of the class draws exactly as in the old font, and the review corpus lists a unit whose picture differs under the change group it shows (`change_groups.reroutes`).
# `no_verdict: true` means a ratified rule decides the whole class, so no unit in it needs its own verdict. The review build gives those units no batch, the review app disables their verdict buttons, and the verdict carry skips them.

- id: split-by-space-or-zwnj
  title: "Split by a space or ZWNJ"
  summary: "A space or ZWNJ ends the word, so each piece draws exactly as it does standing alone."
  status: by-design
  no_verdict: true
  match: {predicate: boundary_window, configs: all}
  exemplars:
    - {config: default, codepoints: "200C:E67A:E665", baseline: "space|qsUtter.noentry|qsMay.en-y5 (y5 join on the shadow)", new: "uni200C|qsUtter.alternate.locked|qsMay.loop.en-y0 (y0 join, word-initial)"}
    - {config: default, codepoints: "0020:E650:E650", baseline: "space|qsPea.half.en-y6.ex-y6|qsPea.en-y6", new: "space|qsPea.half.ex-y6|qsPea.full.en-y6 (the bare E650:E650 row's name-grain divergence, repeated across a space)"}
  why: |
    The ratified rule that a boundary is a word boundary (design section 3.4): a window containing a run-splitting boundary, space or ZWNJ, never needs its own verdict. The letter after a boundary is word-initial and the letter before it word-final, so the new font renders every segment of a boundary window the same as that segment standing alone. The font's own checks enforce this, not this ledger: gate:conform's split-buffer check tests it on every build over the full enumeration for every `splits_runs` token, and the rune schema has no `is: space` or `is: zwnj`, so no record can tell a run-splitting boundary from a text edge.
    A boundary row can therefore diverge from the baseline in only two ways, and neither can be judged here. A divergence inside a segment also appears on that segment's own enumerated row, because every segment of a window of length 5 or less is itself such a window. Any other divergence is the old font treating the two sides of a boundary inconsistently, such as `·Utter ~b~ ·May` after a space against `·Utter ~x~ ·May` after a ZWNJ, which this rule removes.
    The class takes every ZWNJ row ahead of every other class, so the post-ZWNJ rulings that identical-unjoined-from-left, joins-next-letter-after-zwnj and join-height-after-zwnj record reach no ZWNJ row. Rows with a position divergence are not absorbed here. They go through kern attribution, because the old font kerns across spaces and through ZWNJ.

- id: identical-unjoined-from-left
  title: "Looks identical: letter not joined from the left"
  summary: "A letter that doesn't join the letter before it (today ·Cheer after ·Way or ·He, and ·Thaw after ·Out+Tea) draws exactly as in the old font; only glyph names differ."
  status: by-design
  match: {predicate: zwnj_word_initial_unification, configs: all}
  ink_identical: true
  exemplars:
    - {config: default, codepoints: "200C:E670:E670", baseline: "space|qsIt.ex-y5|qsIt", new: "uni200C|qsIt.sole.locked|qsIt.sole"}
  why: |
    A letter after a ZWNJ is word-initial in the new model (design section 3.4). The new model has no authored `.noentry` variants; the ZWNJ lock mints locked copies instead, so every post-ZWNJ position differs at name grain (the old `<x>.noentry` or a leaked bare name, against the new `<cell>.locked`). The junctions agree, and the locked copy draws the same bitmap as the old `.noentry` glyph. split-by-space-or-zwnj takes every ZWNJ row first, and the old pipeline mints no `.noentry` glyph after the namer dot, so the rows this entry covers are the `.noentry` variants the old font also draws after a letter, where both fonts break the pair: ·Thaw after a Tall letter where the old font draws its after-Tall break under the `.noentry` name rather than `qsThaw.after-tall` (after ·Out+Tea, and before ·See+Utter), and ·Cheer after ·Way or ·He (its `noentry_after` derive). Those rows differ from the new cells only at name grain: the `.noentry` suffix, the lock token in the `qsThaw.noentry` alias, or an onward exit the `.noentry` name does not spell out. The rows are not all ink-identical end to end, though: ·Way·Cheer·It·Roe and ·He·Cheer·It·Roe also draw the baseline bar that the old font's shortened-bottom ·Roe omits, and the `qsRoe.en-ext-1-at-5` alias keeps that redraw out of name grain. `roe-baseline-bar-kept-after-it` in `rebuild/standing-approvals.yaml` covers the redraw; this entry covers only the `.noentry` name grain. ·They+Utter's `noentry_after` variant, which the old font also draws after a letter, reaches this entry in no row, because every divergent row that has it also differs elsewhere. The entry is also the record of the post-ZWNJ ruling, which split-by-space-or-zwnj cites.

- id: ss03-tea-oy-ligature-kept
  title: "ss03 keeps the ·Tea+Oy ligature"
  summary: "With ss03 on, ·Tea·Oy still forms ·Tea+Oy, so `·May ~x~ ·Tea.half | ·Oy` becomes `·May | ·Tea+Oy`."
  status: approved
  match: {predicate: post_marker_ligature_formation, configs: all}
  exemplars:
    - {config: default, codepoints: "200C:E652:E679", baseline: "space|qsTea.noentry|qsOy (unformed)", new: "uni200C|qsTea_qsOy.sole.locked"}
  note: "Some units also gain a join before ·May (`·Way ~b~ ·May`, `·He ~b~ ·May`), which no ruling covers."
  why: |
    Ligature formation is unconditional and runs before the stylistic-set marker substitutions, so ·Tea·Oy forms under every stylistic set except ss10, whose input substitution replaces every letter first. Under ss03 the old font renames the lead ·Tea before its ligature pass, joining half-·Tea to a letter that leaves at the x-height, so there the ligature never forms: the old `·X ~x~ ·Tea.half | ·Oy` is `·X | ·Tea+Oy` in the rebuild.
    The user approved this change as a whole ("never going to have a different opinion unless ·X is ·Out"). ·May before the ligature settles on its loop stance with the full exit terminal and no pull-back, as the user chose.

- id: joins-next-letter-after-zwnj
  title: "A letter after a ZWNJ still joins the next letter"
  summary: "A letter right after a ZWNJ loses only its join to the left; it still joins the letter after it, as after a space."
  status: approved
  match: {predicate: zwnj_follower_exit_restored, configs: all}
  exemplars:
    - {config: default, codepoints: "200C:E665:E665:E670", baseline: "space|qsMay.noentry|qsMay.ex-ext-1|qsIt.en-y5.ex-y0 (break after the locked May)", new: "uni200C|qsMay.grounded-loop.ex-y0.locked|qsMay.loop.en-y0.ex-y5.ex-ext-1|qsIt.sole.en-y5 (y0 join gained)"}
  why: |
    In the old font the `qsMay.noentry` glyph keeps only the bare ·May's x-height exit, so where a post-ZWNJ ·May becomes that glyph it cannot join to the right at the baseline, as in the exemplar's break before the second ·May. The locked copy removes only the entry, because the ZWNJ break is the left junction, so the letter keeps its right-side joins. Design section 3.4: ZWNJ splits the run and does not take away the word-initial letter's joins. Round-1 verdict: 6 approvals. In u-0267's window the gained join draws without the en-ext-1 pixel the user rejected, because qsIt has no halves entry-extension record. split-by-space-or-zwnj takes every ZWNJ row first, so this entry covers only namer-dot rows, if any, where the old font's `.noentry` glyphs after the dot also lose their right-side joins. The entry is kept as the record of this ruling, which split-by-space-or-zwnj cites.

- id: join-height-after-zwnj
  title: "Join height after a ZWNJ"
  summary: "After a ZWNJ, a letter joins the next one at the height it uses after a space, so `·Utter ~x~ ·May` becomes `·Utter ~b~ ·May`."
  status: by-design
  match: {predicate: zwnj_word_initial_junction_moved, configs: all}
  exemplars:
    - {config: default, codepoints: "200C:E67A:E665", baseline: "space|qsUtter.noentry|qsMay.en-y5 (y5 join on the shadow)", new: "uni200C|qsUtter.alternate.ex-baseline|qsMay.loop.en-baseline (y0 join, word-initial)"}
  why: |
    The companion of identical-unjoined-from-left for rows where the old `.noentry` stance joined its follower at a different junction height than word-initial settlement does, so the unification moves the junction. Post-ZWNJ ·Utter·May is the example: the old `qsUtter.noentry` joins ·May at the x-height (y5), but ·Utter settled as word-initial, identical to its post-space and bare forms, joins ·May at the baseline (y0). The old font is inconsistent here (post-space ·Utter·May joins at y0, post-ZWNJ at y5), and the new model uses the word-initial form after ZWNJ (design section 3.4). The predicate matches only when the only junction change is a move with no gain and no loss, so a post-ZWNJ row that also gains or loses a junction goes to its own class. The ratified rule that a ZWNJ is a word boundary replaces the human verdict pass this entry waited for: split-by-space-or-zwnj takes every ZWNJ row first, so this entry covers only namer-dot rows, if any. The entry is kept as the record of this ruling, which split-by-space-or-zwnj cites.

- id: new-joins-near-tea-oy
  title: "New joins near ·Tea+Oy"
  summary: "In a word with ·Tea+Oy, letters the old font left apart join, mostly the two letters before it, as in `·Day ~b~ ·Gay | ·Tea+Oy`."
  status: per-unit
  match: {predicate: pre_ligature_cleanup_regularized, configs: all}
  exemplars:
    - {config: default, codepoints: "E652:E670:E652:E679", baseline: "qsTea|qsIt|qsTea_qsOy (Tea.It break)", new: "qsTea.half.ex-y5|qsIt.sole.en-y5|qsTea_qsOy (y5 join kept)"}
  why: |
    The classifier sends a row here when it gains a join and loses or moves none in a window that holds ·Tea·Oy. Most of these rows join the two letters before the ligature. There the old font's calt_post_liga_left_cleanup_pred reverts the join on the predecessor's left whenever the predecessor leaves its exit unjoined before the entryless ligature, which also undoes junctions the unjoined exit never touched (the demote and cleanup passes the rebuild does not port, design section 13.4). Settlement leaves only the one declined exit unjoined, and the unrelated join one position to the left stays. In the other rows the ligature joins onward under ss04 or ss05, or a letter after it gains a join.
    The user approved the cleanup case. No ruling covers the class as a whole, so each unit takes its own verdict.

- id: join-switches-sides
  title: "Join switches sides of a letter"
  summary: "A letter that joined one neighbor joins the other instead: `·Zoo | ·Utter ~b~ ·Ooze` becomes `·Zoo ~b~ ·Utter | ·Ooze`."
  status: per-unit
  match: {predicate: regrouped_chain, configs: all}
  exemplars:
    - {config: default, codepoints: "E650:E665:E650:E650", baseline: "qsPea|qsMay.en-y0.ex-y5.en-ext-1|qsPea.half.en-y6.ex-y6|qsPea.en-y6 (y0,break,y6)", new: "qsPea.full.ex-y0|qsMay.loop.en-y0.ex-y5.en-ext-1.ex-ext-1|qsPea.full.en-y5|qsPea.full (y0,y5,break)"}
    - {config: default, codepoints: "200C:E665:E665:E665", baseline: "space|qsMay.noentry|qsMay.ex-y0|qsMay.en-y0.ex-y5 (break,y0 on the second pair)", new: "uni200C|qsMay.grounded-loop.ex-y0.locked|qsMay.loop.en-y0.ex-bind-pulled-back|qsMay.loop (y0 on the first pair)"}
    - {config: default, codepoints: "E679:E652:E670:E670", baseline: "qsOy|qsTea.en-y0|qsIt.ex-y5|qsIt (y0,break,break)", new: "qsOy.sole|qsTea.half.ex-y5|qsIt.sole.en-y5.ex-y0.ex-ext-1|qsIt.sole.en-y0 (break,y5,y0 — two joins for one)"}
  why: |
    Settlement's ranking (the optimistic third term, then `order:`, then the final tiebreak) groups some chains differently from the old font's greedy chain of substitutions: the same number of joins on a different junction, the mismatches in unpinned windows of design section 15.4. The classifier sends a row here when it both loses a join and gains one. In most rows a letter trades its join on one side for a join on the other.
    Where the user prefers the old grouping, yielding prefers restore it and the windows leave this class: on qsOy, on the ·Tea+Oy ligature, on qsIt (the ·It·It decline before ·May) and on qsMay (the greedy ·May·May pairing). One unscoped qsDay record yields before ·Tea followed by ·Day, ·Day·Utter, ·May, ·Low, ·It or any letter half-·Tea joins at the x-height (·Zoo, ·J’ai, ·Jay, ·No, ·Roe, ·Et, ·Eight, ·Awe, ·Ox and the ·J’ai and ·Jay ligatures with ·Utter). qsNo declines its baseline exit before ·Tea and the same x-height receivers after any left, and before ·Tea·It after a left joined at the baseline. Together they restore the old grouping of the `·X·Day·Tea·Day`, `·X·Day·Tea·It`, `·X·No·Tea·It`, `·X·Day·Tea·Roe` and `·X·No·Tea·Roe` families and their siblings. The ·Oy in qsNo's list of lefts also matches the ·Tea+Oy ligature through left-family transparency, so forming ·Tea+Oy cannot change the grouping its trailing ·Oy would get unformed.
    The user's ruling splits the `·Day ~b~ ·Tea` and `·No ~b~ ·Tea` regroupings, which move the join one junction left, by what ·Tea would join onward. Half-·Tea keeps its forward x-height join wherever the left letter would only trade it for a baseline join into ·Tea, so a later migration's letter that half-·Tea joins at the x-height belongs in both receiver lists. Before the remaining followers that only full ·Tea joins (·Ah, ·I, ·Ooze, ·Vie, ·At, ·Out, ·See, ·Utter), the regroupings are ruled as they are: the left join stands and ·Tea does not join onward. ·Day also yields before ·Tea·No at a run end (the `then: {is: boundary}` record), and wherever ·Day or ·No yields before ·Tea·No, full ·Tea joins ·No.alt at the baseline through qsTea's `order:`, without a ·Tea or ·No record for it. The yields decide only ties, so the windows where the rebuild's grouping scores more joins at the deciding junction stay in this class: `·X ~x~ ·Utter.alt ~b~ ·Tea | ·Y`, where ·Utter.alt cannot decline its baseline exit, and `·No ~b~ ·Tea | ·It ~x~ ·Y` and `·She ~b~ ·Tea | ·It ~x~ ·Y` at a run start.
    The `·X·Tea·It·Y` windows keep the left join into ·Tea, as the old font and The Manual draw them (`·Day | ·Ye ~b~ ·Ooze ~b~ ·Tea | ·It ~b~ ·Zoo`), when ·X exits at the baseline (·Bay, ·Key, ·Gay, ·Zoo, ·J’ai, ·Cheer, ·Jay, ·Eight, ·Awe, ·Ox, ·Ooze) and the unentered ·It exits on its own: at the baseline before ·Day, ·Zoo, ·I and ·Utter, or at the x-height before ·Roe and the other x-height receivers. Each of those letters has a prefer that declines its baseline join into ·Tea, except when ·It and one of those receivers follow. qsEight also carries the opposite prefer (`exit baseline over exit none` on the same chain), because its stance order would otherwise settle the tie on the loop, which cannot exit into ·Tea. ·They and ·She decline without the exception, because the old font breaks their ·Tea join whenever ·It follows. ·Et is not in the receiver lists, because qsIt refuses `·It ~x~ ·Et` and qsTea's half-stance follower prefer before ·It·Et decides that window. An ·It·It follower is left out because the old font draws that ·It bare, so the window stays in this class as a same-count regrouping.
    The Manual pin `·Key ~b~ ·No.alt | ·Tea.half ~x~ ·It` (the-manual.html:4157) is in this family and disagrees with the rebuild's grouping, and the pin gate allows no waivers. So qsNo's decline of its baseline exit before ·Tea·It names every baseline-exiting left the old font draws that way (·Bay, ·Key, ·Gay, ·Vie, ·Zoo, ·She, ·J'ai, ·Cheer, ·Jay, ·Ye and the rest, beside ·Day, ·It and ·Oy). It also names the ·Pea, ·Tea, ·He and ·No lefts. The old font joins those to ·No at the x-height, while the rebuild keeps `·Pea ~b~ ·No.alt` at the baseline, and in both half-·Tea joins ·It. It leaves out ·Roe, whose own x-height preference on qsRoe and the decline would demand different outcomes at incomparable specificity. The ·Bay, ·Key and ·Ye lefts reach the old junctions and leave this class.
    No ruling covers the other regroupings, such as ·Tea·Utter, ·Et·Pea and ·Roe·May, so each unit takes its own verdict.

- id: ss03-adds-joins-around-tea
  title: "ss03 adds joins around ·Tea"
  summary: "With ss03 on, the full ·Tea joins the next letter, as in `·Utter ~x~ ·Tea ~b~ ·Low` where the old font drew `·Utter ~x~ ·Tea.half | ·Low`."
  status: approved
  match: {predicate: ss03_chain_join_gains, configs: [ss03, ss03+ss05]}
  exemplars:
    - {config: ss03, codepoints: "E652:E665:E652", baseline: "qsTea|qsMay.ex-ext-1|qsTea.half.en-y5.after-xheight-exit (break,y5)", new: "qsTea.full.ex-y0|qsMay.en-y0.ex-y5.en-ext-1.ex-ext-1|qsTea.half.en-y5 (y0,y5)"}
    - {config: ss03, codepoints: "E670:E665:E652", baseline: "qsIt|qsMay.ex-ext-1|qsTea.half.en-y5.after-xheight-exit (break,y5)", new: "qsIt.sole.ex-y0|qsMay.loop.en-y0.ex-y5.en-ext-1.ex-ext-1|qsTea.half.en-y5 (y0,y5)"}
    - {config: ss03, codepoints: "E67A:E652:E67A", baseline: "qsUtter.ex-ext-1|qsTea.half.en-y5.after-xheight-exit|qsUtter (y5,break)", new: "qsUtter.mono.ex-y5.ex-ext-1|qsTea.full.en-y5.ex-y0|qsUtter.mono.en-y0 (y5,y0)"}
  note: "Some units also gain a join into ·May before the full ·Tea, which the full-bar ruling doesn't name."
  why: |
    Under ss03, maximizing the joins across the window gains chains that the old font's pair-by-pair substitutions cannot see. There are three shapes.
    ·Tea·May·Tea and ·May·May·Tea gain the second join, on the ·May·Tea side. ·It·May·Tea gains the first join: the old font uses ·May's entryless after-xheight-exit stance before half-·Tea, so the unentered ·It cannot reach it, while settlement's ·May cell has both anchors (en-y0 and the extended ex-y5), so the `·It ~b~ ·May` join and the `·May ~x~ ·Tea` join both take effect. The user approved both shapes.
    The third shape comes from the full ·Tea bar. Under ss03, qsTea's full stance unlocks its x-height entry after ·Fee, ·May, ·Low, ·I, ·Ah, ·Utter and ·Out, so those x-height exiters reach the full bar. Where the follower accepts the bar's baseline exit, the whole window chains: ·Utter·Tea·Day and similar windows render `·X ~x~ ·Tea ~b~ ·Y`, where the old font drew the half stub and dropped the forward join. The unlock names only the left letter, with no follower condition and no except list; the user chose that form from rendered side-by-sides of it and of a form with an except list. Before a follower that cannot accept the join (·Pea, ·It, a second ·Tea), the entered full bar stands with its lower half dangling instead of the half stub, and ·X·Tea·No chains into the alternate ·No as in the default configuration. This is the ratified meaning of ss03: after a flat x-height stroke, ·Tea draws the full bar whether or not the follower joins it.

- id: it-joins-both-sides
  title: "·It joins on both sides"
  summary: "Mostly with ss04 on, an ·It joined after ·Bay, ·Gay, ·She or ·Day also joins the letter after it, as in `·Bay ~b~ ·It ~b~ ·Thaw`."
  status: per-unit
  match: {predicate: entered_it_baseline_join_gain, configs: all}
  exemplars:
    - {config: default, codepoints: "E652:E670:E670", baseline: "qsTea.half.ex-y5|qsIt.en-y5.ex-y0|qsIt (y5,break)", new: "qsTea.half.ex-y5|qsIt.sole.en-y5.ex-y0.ex-ext-1|qsIt.sole.en-y0 (y5,y0)"}
  why: |
    The classifier sends a row here when it gains a join leaving an ·It that is joined on its left, and loses or moves none. Almost every such row differs only with ss04 on, where ·It joins at the baseline on both sides; a few ·They+Zoo·It windows differ without it.
    The old YAML puts the not_before [qsTea, qsIt, qsRoe] baseline-exit refusal only on the unentered stance (quikscript.yaml `entry_nowhere_exit_baseline`; the entered en-y5/ex-y0 stance has no such refusal), so a self-scoped refusal is the faithful transcription, and an entered ·It may join the letter after it at the baseline. The old font's break there comes from its chain of substitutions, not from an authored rule. The extended exit (ex-ext-1, the entered-exit extension) keeps the two verticals two columns apart, so the refusal's reason (one extra-thick stroke) does not apply. An unentered-·It gain under ss03 (the ·It·May·Tea chains) goes to ss03-adds-joins-around-tea instead, and one outside ss03 stays unmatched.
    ·It never joins itself (the IT1 ruling), so the exemplar's `·It ~b~ ·It` join is one the rebuild does not make. No ruling covers the joins the class holds, so each unit takes its own verdict.

- id: pea-joins-next-letter
  title: "·Pea joins the next letter"
  summary: "Where the old font broke after ·Pea, it joins a following ·Pea, ·J’ai, ·Utter or ·May, as in `·Pea.half ~x~ ·J’ai`; in a few windows ·Utter joins ·Pea instead."
  status: approved
  match: {predicate: pea_chain_regularized, configs: all}
  exemplars:
    - {config: default, codepoints: "E650:E650:E67A", baseline: "qsPea.half.en-y6.ex-y6|qsPea.en-y6|qsUtter (y6,break)", new: "qsPea.half.ex-y6|qsPea.full.en-y6.ex-y0|qsUtter.mono.en-y0 (y6,y0)"}
  why: |
    The classifier sends a row here when every junction it gains has a ·Pea on its left and it loses or moves none. The old font breaks after that ·Pea, and settlement joins it to the next letter, because capability and refusals permit the join and settlement maximizes the join count. The ·Pea follows an exit at one of two heights.
    After an x-height exit (·May, ·Utter or a `*_qsUtter` ligature), the old font draws the full qsPea.en-y5.ex-y0, whose one exit is at the baseline, and breaks before ·Pea and before ·J'ai (or the ·J'ai·Utter ligature). Settlement draws the half ·Pea and joins the follower: `·Utter ~x~ ·Pea.half ~6~ ·Pea` and `·Utter ~x~ ·Pea.half ~x~ ·J'ai`. Where the old font draws `·Utter ~x~ ·Pea | ·Pea.half ~x~ ·It`, settlement draws `·Utter ~x~ ·Pea.half ~6~ ·Pea.half ~x~ ·It`. The old font draws this ·Pea as the half qsPea.half.en-y5.ex-y5 before its x-height receivers other than ·J'ai, but it has no half ·Pea with an x-height entry and a y6 exit, so the ·Pea·Pea gain uses a cell the baseline never shows.
    After a y6 exit (half ·Pea or ·See), the old font draws the exitless qsPea.en-y6 before ·Utter, and under ss03 before a ·May that joins ·Tea: `·Pea.half ~6~ ·Pea | ·Utter`. Settlement gives that ·Pea the baseline exit the old font draws before its other baseline receivers (qsPea.en-y6.ex-y0): `·Pea.half ~6~ ·Pea ~b~ ·Utter`, and under ss03 `·Pea.half ~6~ ·Pea ~b~ ·May ~x~ ·Tea`.
    Round-1 verdict: 15 approvals.

- id: longer-entry-join
  title: "Entry join a pixel longer"
  summary: "A letter's entry is extended a pixel where the old font didn't extend it, mostly ·Eight after half-·Pea, half-·Tea or half-·He, and ·Cheer after ·Day+Utter."
  status: per-unit
  match: {predicate: halves_entry_extension_restored, configs: all}
  exemplars:
    - {config: ss03, codepoints: "E652:E653:E67A:E652", baseline: "qsTea.ex-y0|qsDay_qsUtter.half.en-y0.ex-y5.ex-ext-1|qsTea.half.en-y5.after-xheight-exit", new: "qsTea/full/None/baseline/|qsDay_qsUtter/half/baseline/x-height/en-ext-1+ex-ext-1|qsTea/half/x-height/None/"}
  why: |
    The classifier sends a row here when a letter's entry is extended by a pixel (an added `en-ext-1`) where the old font drew no extension. The windows nobody has ruled on come mostly from extend records in qsEight and qsCheer: ·Eight's entry after half-·Pea, half-·Tea and half-·He, and ·Cheer's after ·Day+Utter. No ruling covers the class as a whole, so each unit takes its own verdict.
    Under ss03, ·Day+Utter keeps its baseline en-ext-1 beside its own exit extension on one cell, where the old font drops the entry side: the ligature's form of the same-junction limit one-extension-per-join records. The exemplar is ·Tea·Day·Utter·Tea under ss03.
    The user rejected qsIt's halves entry extension ("this widens the ·Tea·It extension for no reason"), so qsIt has no such record, and neither do qsDay, qsOy, qsPea, qsMay's grounded loop, qsDay_qsUtter, qsTea or qsUtter. halves-closer-to-no and may-farther-after-day-utter record how ·No after the half letters and ·May after ·Day+Utter differ from the old font without those records.

- id: one-extension-per-join
  title: "At most one extension per join"
  summary: "Where the old font extended both letters into one join, the rebuild extends at most one, so the pair sits a pixel or two closer, as in `·May ~x~ ·Zoo`."
  status: approved
  match: {predicate: same_junction_extension_non_summing, configs: all}
  exemplars:
    - {config: default, codepoints: "E650:E670:E665", baseline: "qsPea.half.ex-y5.ex-dips|qsIt.en-y5.ex-y0.ex-ext-1|qsMay.en-y0.ex-y5.en-ext-1", new: "...|qsIt...ex-ext-1|qsMay.loop.en-y0 (no en-ext-1)"}
    - {config: default, codepoints: "E655:E65D", baseline: "qsGay.ex-y5.ex-ext-2|qsJai.en-y5.ex-y0.en-ext-2", new: "qsGay/sole/None/x-height/ex-ext-3|qsJai/sole/x-height/None/ (no en-ext-2; ·Gay's exit carries the whole connector)"}
  note: "Two round-2 rejects stand as an engine limit; the why names them."
  why: |
    Extensions never add up on one junction (design section 6.2): when the predecessor's exit already carries the junction's extra pixel, the follower's entry extension is suppressed. The old pipeline applies both on these windows. The user approved this kind of change in round 1, and `·May ~x~ ·Roe` and `·It ~b~ ·Vie` in the ·Roe and ·Vie review sessions.
    Two windows the user rejected stand as an engine limit: u-0417 (·Pea·May·It·May) and u-0437 (·May·It·May after a ZWNJ). A build-tested search found no record in the closed vocabulary that turns them back to the old ink without changing other windows: the only mechanism that drops ·May's en-ext-1 is this suppression, which fires only on the immediate left predecessor's exit extension. Honoring the rejects would mean repealing the non-summing rule or adding a condition on the letter two to the left, which the engine does not have, so the approvals govern the class. Taking the pixel off ·May's baseline entry (may-closer-at-baseline-join) does not reach these two: they are same-junction windows where the predecessor's own ex-ext-1 drives the suppression, so an engine fix still needs the condition on the letter two to the left.
    ·Gay ~x~ ·J'ai shows the same kind of change at by-2. The old font draws that junction with both sides' extensions added (·Gay's ex-ext-2 and ·J'ai's or ·J'ai+Utter's en-ext-2), and settlement suppresses the entry side under the same rule. The classifier's same-junction token covers en-ext-2 against an ex-ext-2 predecessor as well as en-ext-1 against ex-ext-1, so these rows match this entry instead of going unmatched.
    ·Gay's side carries the pixel. ·Gay's x-height exit extends by 3 toward ·J'ai and ·J'ai+Utter, so the shaped width matches the old font and the divergence is at name grain only: one cell writes across one glyph what the old font wrote across two. The runes have no ·J'ai- or ·J'ai+Utter-side en-ext-2 records: the non-summing rule makes a receiver's entry extension unreachable behind an extending predecessor, and ·Gay's exit always extends here, so such records could never fire. ·Gay's own records carry the old font's conditions, read from the baseline rows.
    The junction is decided for the pair: ·Gay ~x~ ·J'ai carries by-3 whatever follows, before the ·J'ai+Utter ligature as before the bare letter. The old font withholds the long connector in two places, and neither is transcribed. When a ·Pea precedes the ·Gay, the old font's substitution takes bare `qsJai` as input, so any earlier lookup that has already renamed ·J'ai makes it miss; that is a compiled artifact, not a rule. The old source's `extend_entry_after` names ·Gay and ·May with no ·Pea clause, and the ·May branch of the same record shows no ·Pea suppression. ·Pea does not enter ·Gay, so the rune extends after it as after every other left. Those ·Pea windows are a position divergence and unmatched, because the old font draws no entry extension there. Before the followers that ·J'ai's own exit extend names, the old font withholds the connector because ·J'ai spends its single extension slot on the exit; the rebuild has no one-slot-per-glyph limit. Where the old font drew the connector long, the rows match this entry at name grain with the old font's shaped width. Where it drew it short, the rebuild is one pixel longer: the ·Vie, ·See, ·No and ·Low windows were already unmatched over ·J'ai's dropped forward reach and also carry ·Gay's longer exit, and the ·Tea, ·Roe, ·It and ·I windows are a new position divergence. Like the ·Gay ~x~ ·No trade-off, this is an intended departure from the old font, and verdicts decide those rows, not a ledger class.

