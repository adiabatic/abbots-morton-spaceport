# The M1 divergence ledger (M1-PLAN section 6): one entry per reviewed class of divergence between settlement and the section 13.1 baseline oracle, over the letters in `baseline_subset.M1_ALPHABET`.
# Every divergent row should match exactly one entry. A row that matches two or more fails the run_m1 gate; a row that matches none is unmatched and waits for a verdict on the review surface. `oracle.classify_divergence` gives each row the highest-precedence class its phenomenon set allows, and its code is the authority on the order: boundary-echo first (any row without a position divergence whose window contains a run-splitting boundary, space or ZWNJ), then no class for any other ss10 row, then ligation, then seam changes, then cell-grain changes. The cell-grain order is halves-entry-extension-restored, same-seam-extension-non-summing, the extension-dropped classes, the respelled and consolidated classes, then zwnj-word-initial-unification, dangling-anchor-dropped and bare-name-live-join; a row with a `+ex-bind-*` or `-ex-ext-1` token gets none of those last three. The classifier leaves some rows unassigned, and two entries match rows with a position divergence among them with function predicates: kern_channel_out_of_scope and may_ligature_seam_loosened. `count` comes from the conformance run's figures and is reviewed as a diff; the run never writes this file. Per-row detail is written to rebuild/out/m1/divergence-audit.tsv.
# Status values: intended (designed behavior, needs no review) | drift-accepted (observed drift, accepted pending human review) | triaged (per-row triage decisions, never accepted automatically) | reviewed-approved (the user approved the class's behavior in the round-1 verdict pass) | reviewed-rejected (the user rejected the class's behavior in the round-1 verdict pass; that round's policy records restore the old behavior, and the entry's why documents the remaining rows).
# `no_verdict: true` means a ratified rule decides the whole class, so no unit in it needs its own verdict. The review build gives those units no batch, the review app disables their verdict buttons, and the verdict carry skips them.

- id: boundary-echo
  status: intended
  no_verdict: true
  match: {predicate: boundary_echo, configs: all}
  count: 33508
  exemplars:
    - {config: default, codepoints: "200C:E67A:E665", baseline: "space|qsUtter.noentry|qsMay.en-y5 (y5 join on the shadow)", new: "uni200C|qsUtter.alternate.locked|qsMay.loop.en-y0 (y0 join, word-initial)"}
    - {config: default, codepoints: "0020:E650:E650", baseline: "space|qsPea.half.en-y6.ex-y6|qsPea.en-y6", new: "space|qsPea.half.ex-y6|qsPea.full.en-y6 (the bare E650:E650 row's name-grain echo across a space)"}
  why: |
    The ratified rule that a boundary is a word boundary (design section 3.4; ratified for ZWNJ on 2026-07-03 and extended to space the same day): a window containing a run-splitting boundary, space or ZWNJ, never needs its own verdict. The letter after a boundary is word-initial and the letter before it word-final, so the new font renders every segment of a boundary window the same as that segment standing alone. The font's own checks enforce this, not this ledger: gate:conform's split-buffer check tests it on every build over the full enumeration for every `splits_runs` token, and the rune schema has no `is: space` or `is: zwnj`, so no record can tell a run-splitting boundary from a text edge.
    A boundary row can therefore diverge from the baseline in only two ways, and neither can be judged here. A divergence inside a segment also appears on that segment's own enumerated row, because every segment of a window of length 5 or less is itself such a window. Any other divergence is the old font treating the two sides of a boundary inconsistently: post-space ·Utter·May joins at y0 while post-ZWNJ ·Utter·May joins at y5 (the old font's post-ZWNJ `.noentry` variants), and space has counterparts of the same kind. This rule removes that inconsistency, and restoring it would require a form conditioned on the boundary.
    ZWNJ evidence: the class absorbs the ZWNJ rows of zwnj-word-initial-unification (round 1: 1,421 ink-identical rows), zwnj-follower-exit-restored (reviewed-approved) and zwnj-word-initial-seam-moved, and the round-2 re-judgment of pairs asked twice (u-15220 approved and u-15230 rejected on identical new ink) that prompted the rule.
    Space evidence: of the 744 space units verdicted before this class existed (679 approve, 32 reject, 31 neither, 2 either), only 2 rejects had no matching reject on their sibling across the boundary: u-15228 ·No·It·Day ␣ and u-15241 ·No·It·Utter ␣ (deferred-ss04). Both contradict their approved bare siblings u-15220 and u-15221, the same double-ask problem as the ZWNJ pair. No space reject was about the space itself, and the rule overrides those two rejects.
    Rows with a position divergence are not absorbed here. They go through kern attribution, because the old font kerns across spaces and through ZWNJ.

- id: zwnj-word-initial-unification
  status: intended
  match: {predicate: zwnj_word_initial_unification, configs: all}
  ink_identical: true
  count: 0
  exemplars:
    - {config: default, codepoints: "200C:E670:E670", baseline: "space|qsIt.ex-y5|qsIt", new: "uni200C|qsIt.hapax.locked|qsIt.hapax"}
  why: |
    A letter after a ZWNJ is word-initial in the new model (design section 3.4). The new model has no authored `.noentry` variants; the chokepoint mints locked twins instead, so every post-ZWNJ position differs at name grain (the old `<x>.noentry` or a leaked bare name, against the new `<cell>.locked`). The seams agree, and the locked twin draws the same bitmap as the old `.noentry` glyph. boundary-echo takes every ZWNJ row first, so this entry covers only the `.noentry` glyphs the old pipeline also mints after the namer dot. The entry is kept as the record of this ruling, which boundary-echo cites.

- id: marker-staging-ligature-formation
  status: intended
  match: {predicate: marker_staging_ligature_formation, configs: all}
  count: 187
  exemplars:
    - {config: default, codepoints: "200C:E652:E679", baseline: "space|qsTea.noentry|qsOy (unformed)", new: "uni200C|qsTea_qsOy.hapax.locked"}
  why: |
    Ligature formation is unconditional and runs before the marker lookups and the chokepoint (the prototype's stage order), so ·Tea·Oy forms directly after a ZWNJ and under every stylistic set except ss10, whose pre-empt replaces every letter first. The old pipeline renames the lead letter first, so there the ligature never forms. Prototype divergence 5 / M1-PLAN expected class 6. Round-1 verdict: 32 approvals. The four "·May should use the loop stance" skip notes are superseded by the user's later choice: ·May settles on the loop stance with its full exit terminal and no pull-back. boundary-echo takes the post-ZWNJ rows, so the classifier sends this entry the ·Tea·Oy rows under ss03 and the ·Day·Utter rows after the namer dot.

- id: zwnj-follower-exit-restored
  status: reviewed-approved
  match: {predicate: zwnj_follower_exit_restored, configs: all}
  count: 0
  exemplars:
    - {config: default, codepoints: "200C:E665:E665:E670", baseline: "space|qsMay.noentry|qsMay.ex-ext-1|qsIt.en-y5.ex-y0 (break after the locked May)", new: "uni200C|qsMay.grounded-loop.ex-y0.locked|qsMay.loop.en-y0.ex-y5.ex-ext-1|qsIt.hapax.en-y5 (y0 join gained)"}
  why: |
    In the old font the `qsMay.noentry` stance has no exit anchor, so a post-ZWNJ ·May cannot join to the right at all. The chokepoint twin removes only the entry, because the ZWNJ break is the left seam, so the letter keeps its right-side joins. Design section 3.4: ZWNJ splits the run and does not take away the word-initial letter's joins. Round-1 verdict: 6 approvals. In u-0267's window the rejected en-ext-1 pixel went away when qsIt's halves entry-extension record was deleted, and the gained join remains. boundary-echo takes every ZWNJ row first, so this entry covers only namer-dot rows, if any, where the old font's `.noentry` glyphs after the dot also lose their right-side joins. The entry is kept as the record of this ruling, which boundary-echo cites.

- id: zwnj-word-initial-seam-moved
  status: drift-accepted
  match: {predicate: zwnj_word_initial_seam_moved, configs: all}
  count: 0
  exemplars:
    - {config: default, codepoints: "200C:E67A:E665", baseline: "space|qsUtter.noentry|qsMay.en-y5 (y5 join on the shadow)", new: "uni200C|qsUtter.alternate.ex-baseline|qsMay.loop.en-baseline (y0 join, word-initial)"}
  why: |
    The companion of zwnj-word-initial-unification for rows where the old `.noentry` stance joined its follower at a different seam height than word-initial settlement does, so the unification moves the seam. Post-ZWNJ ·Utter·May is the example: the old `qsUtter.noentry` joins ·May at the x-height (y5), but ·Utter settled as word-initial, identical to its post-space and bare forms, joins ·May at the baseline (y0). The old font is inconsistent here (post-space ·Utter·May joins at y0, post-ZWNJ at y5), and the new model uses the word-initial form after ZWNJ (design section 3.4). The predicate matches only when the only seam change is a move with no gain and no loss, so a post-ZWNJ row that also gains or loses a seam goes to its own class. The ratified rule that a ZWNJ is a word boundary replaces the human verdict pass this entry waited for: boundary-echo takes every ZWNJ row first, so this entry covers only namer-dot rows, if any. The entry is kept as the record of this ruling, which boundary-echo cites.

- id: pre-ligature-cleanup-regularized
  status: reviewed-approved
  match: {predicate: pre_ligature_cleanup_regularized, configs: all}
  count: 38
  exemplars:
    - {config: default, codepoints: "E652:E670:E652:E679", baseline: "qsTea|qsIt|qsTea_qsOy (Tea.It break)", new: "qsTea.half.ex-y5|qsIt.hapax.en-y5|qsTea_qsOy (y5 join kept)"}
  why: |
    The old font's calt_post_liga_left_cleanup_pred reverts the join on the predecessor's left whenever the predecessor withdraws before the entryless ligature, which also undoes seams the withdrawal never touched (the demote and cleanup passes the rebuild does not port, recon section 13.4). Settlement withdraws only the one declined exit, and the unrelated join one position to the left stays. Round-1 verdict: 6 approvals. In u-0272 the kept join lost the rejected en-ext-1 pixel when qsIt's halves entry-extension record was deleted; the exemplar shows the rendering without it.

- id: regrouping-floor-drift
  status: reviewed-rejected
  match: {predicate: regrouping_floor_drift, configs: all}
  count: 34
  exemplars:
    - {config: default, codepoints: "E650:E665:E650:E650", baseline: "qsPea|qsMay.en-y0.ex-y5.en-ext-1|qsPea.half.en-y6.ex-y6|qsPea.en-y6 (y0,break,y6)", new: "qsPea.full.ex-y0|qsMay.loop.en-y0.ex-y5.en-ext-1.ex-ext-1|qsPea.full.en-y5|qsPea.full (y0,y5,break)"}
    - {config: default, codepoints: "200C:E665:E665:E665", baseline: "space|qsMay.noentry|qsMay.ex-y0|qsMay.en-y0.ex-y5 (break,y0 on the second pair)", new: "uni200C|qsMay.grounded-loop.ex-y0.locked|qsMay.loop.en-y0.ex-bind-pulled-back|qsMay.loop (y0 on the first pair)"}
    - {config: default, codepoints: "E679:E652:E670:E670", baseline: "qsOy|qsTea.en-y0|qsIt.ex-y5|qsIt (y0,break,break)", new: "qsOy.hapax|qsTea.half.ex-y5|qsIt.hapax.en-y5.ex-y0.ex-ext-1|qsIt.hapax.en-y0 (break,y5,y0 — two joins for one)"}
  why: |
    Settlement's ranking (the optimistic third term, then `order:`, then the structural floor) groups some chains differently from the old font's greedy chain of substitutions: the same number of joins on a different seam, the don't-care drift of design section 15.4.
    Round 1: 43 rejects ("The old way seems nicer to write out by hand"; u-0280 "I think I would rather prefer ·Tea·It to join"). The yielding prefers on qsOy, qsTea_qsOy (the ligature twin), qsIt (the ·It·It-before-·May decline) and qsMay (the greedy ·May·May pairing) restore the old grouping. That left u-0277 (·Pea·May·Pea·Pea, no ·Oy, ·It·It or ·May·May seam), u-0857 (post-ZWNJ ·May·May·May, grouping on the first pair like its space-boundary sibling), and four formerly machine-approved ·Oy windows (·Oy·Tea·It·It, ·Oy·It·May·Tea, ·Oy·It·May·May, ·Oy·Tea·May·Tea), where the qsOy decline gives up the word-initial ·Oy join for the follower joins the user said they prefer.
    Round 3 (the echo-group sitting of 2026-07-18): those open verdicts were approvals (the four ·Oy windows at u-9265, u-9268 and u-9296 to u-9298, and u-0277's unmatched-misc successor u-23024; u-0857's row is covered by boundary-echo). Three families were rejected outright: ·X·Day·Tea·Day, ·X·Day·Tea·It and ·X·No·Tea·It, 17 windows tagged [echo-harmonize e-0059/e-0061/e-0087]. Wider yielding prefers restore them. qsDay has one unscoped record over the followers ·Day, ·Day·Utter, ·May, ·Low and ·It. qsNo declines its baseline exit before ·Tea·It after a left joined at the baseline. That record names its lefts because the ·Pea, ·Tea and ·No·No·Tea·It siblings carry approved seam-loss-withdrawal verdicts for the M1 chain. Its ·Oy also matches the ·Tea·Oy ligature through left-family transparency, so forming ·Tea·Oy cannot change the grouping its trailing ·Oy would get unformed. Those rows reach the old seams and match dangling-anchor-dropped at name grain. The ·X·Day·Tea·No family (11 windows judged neither, echo e-0060) goes the other way: ·Day also yields before ·Tea·No at a run end (the `then: {is: boundary}` record), and full ·Tea joins ·No.alt at the baseline through qsTea's `order:` with no new ·Tea or ·No record. Those rows, with ·Day·Tea·No·dot (u-9176, previously either), are unmatched pending new verdicts.

    Round 4 (the yield-family sitting): the `·Day ~b~ ·Tea` and `·No ~b~ ·Tea` left-hop rows are ratified as they are, and the yielding lists from round 3 are final. The sitting judged one example per seam-follower shape the migrated alphabet reaches and left each with M1's grouping, some approved and the rest as don't-care. So a follower that qsDay and qsNo do not name keeps the left join, and ·Tea does not join onward. The lists record the user's preferences and are not an incomplete enumeration, so a later migration's `·Day·Tea·X` window is a spot check against this ruling, not a new question. The rows stay in this class and can still be judged one by one (no `no_verdict`), because the same predicate also matches left-hop regroupings on every other seam pair, such as ·Tea·Utter, ·Et·Pea and ·Roe·May, which this sitting did not rule on.

    The `·X·Tea·It·Y` windows keep the left join into ·Tea, as the old font and The Manual draw them (`·Day | ·Ye ~b~ ·Ooze ~b~ ·Tea | ·It ~b~ ·Zoo`), when ·X exits at the baseline (·Bay, ·Key, ·Gay, ·Zoo, ·J’ai, ·Cheer, ·Jay, ·Eight, ·Awe, ·Ox, ·Ooze) and the unentered ·It exits on its own: at the baseline before ·Day, ·Zoo, ·I and ·Utter, or at the x-height before ·Roe and the other x-height receivers. Each of those letters has a prefer that declines its baseline join into ·Tea, except when ·It and one of those receivers follow. qsEight also carries the opposite prefer (`exit baseline over exit none` on the same chain), because its stance order would otherwise settle the tie on the loop, which cannot exit into ·Tea. ·They and ·She decline without the exception, because the old font breaks their ·Tea join whenever ·It follows. ·Et is not in the receiver lists, because qsIt refuses `·It ~x~ ·Et` and qsTea's half-stance vote before ·It·Et decides that window. An ·It·It follower is left out because the old font draws that ·It bare, so the window stays in this class as a same-count regrouping.

    The Manual pin `·Key ~b~ ·No.alt | ·Tea.half ~x~ ·It` (the-manual.html:4153) is in this family and disagrees with the rebuild's grouping, and the pin gate allows no waivers. So qsNo's decline of its baseline exit before ·Tea·It names every baseline-exiting left the old font draws that way (·Bay, ·Key, ·Gay, ·Vie, ·Zoo, ·She, ·J'ai, ·Cheer, ·Jay, ·Ye and the rest, beside ·Day, ·It and ·Oy from round 3). It still leaves out the x-height-entered ·Pea, ·Tea and ·No siblings, whose verdicts are approved, and ·Roe, whose own x-height preference decides its seam. The ·Bay, ·Key and ·Ye lefts reach the old seams and leave this class.

- id: ss03-chain-join-gains
  status: reviewed-approved
  match: {predicate: ss03_chain_join_gains, configs: [ss03, ss03+ss05]}
  count: 2346
  exemplars:
    - {config: ss03, codepoints: "E652:E665:E652", baseline: "qsTea|qsMay.ex-ext-1|qsTea.half.en-y5.after-xheight-exit (break,y5)", new: "qsTea.full.ex-y0|qsMay.en-y0.ex-y5.en-ext-1.ex-ext-1|qsTea.half.en-y5 (y0,y5)"}
    - {config: ss03, codepoints: "E670:E665:E652", baseline: "qsIt|qsMay.ex-ext-1|qsTea.half.en-y5.after-xheight-exit (break,y5)", new: "qsIt.hapax.ex-y0|qsMay.loop.en-y0.ex-y5.en-ext-1.ex-ext-1|qsTea.half.en-y5 (y0,y5)"}
    - {config: ss03, codepoints: "E67A:E652:E67A", baseline: "qsUtter.ex-ext-1|qsTea.half.en-y5.after-xheight-exit|qsUtter (y5,break)", new: "qsUtter.mono.ex-y5.ex-ext-1|qsTea.full.en-y5.ex-y0|qsUtter.mono.en-y0 (y5,y0)"}
  why: |
    Under ss03, maximizing the joins across the window gains chains that the old font's pair-by-pair substitutions cannot see. There are three shapes.
    ·Tea·May·Tea and ·May·May·Tea gain the second join, on the ·May·Tea side (prototype deviation 3 / M1-PLAN expected class 7). ·It·May·Tea gains the first join: the old font uses ·May's entryless after-xheight-exit stance before half-·Tea, so the unentered ·It cannot reach it, while settlement's ·May cell has both anchors (en-y0 and the extended ex-y5), so the ·It·May baseline join and the ·May·Tea join both take effect. Round-1 verdict: 40 approvals. u-0356's post-ZWNJ ·Tea·It join keeps its gain, and its connector went back to the unextended width when qsIt's halves entry-extension record was deleted.

    The third shape comes from the full ·Tea bar (the blessing-pass verdicts u-6645, u-6646 and u-6647, and the ss03 full-·Tea rejects u-6550, u-6551, u-6553, u-6642 and u-6643). Under ss03, qsTea's full stance unlocks its x-height entry after ·Fee, ·May, ·Low, ·I, ·Ah, ·Utter and ·Out, so those x-height exiters reach the full bar. Where the follower accepts the bar's baseline exit, the whole window chains: ·Utter·Tea·Day and similar windows render `·X ~x~ ·Tea(full) ~b~ ·Y`, where the old font drew the half stub and dropped the forward join. The gate is capability-grained with no except list, which the user chose on 2026-07-04 from a rendered side-by-side of both options, and it has no follower condition. Before a follower that cannot accept the join (·Pea, ·It, a second ·Tea), the entered full bar stands with its lower half dangling instead of the half stub, and ·X·Tea·No chains into the alternate ·No as in the default configuration. This replaces the u-1329-style approvals of the half-stub-and-break shapes. This is the ratified meaning of ss03: after a flat x-height stroke, ·Tea draws the full bar whether or not the follower joins it. These rows still await family-level approval on the review surface like every other member.

- id: entered-it-baseline-join-gain
  status: reviewed-approved
  match: {predicate: entered_it_baseline_join_gain, configs: all}
  count: 0
  exemplars:
    - {config: default, codepoints: "E652:E670:E670", baseline: "qsTea.half.ex-y5|qsIt.en-y5.ex-y0|qsIt (y5,break)", new: "qsTea.half.ex-y5|qsIt.hapax.en-y5.ex-y0.ex-ext-1|qsIt.hapax.en-y0 (y5,y0)"}
  why: |
    The class matches nothing. The user ruled that ·It never joins itself (IT1), so qsIt refuses its baseline entry after qsIt as it refuses the x-height one, and that rule supersedes the round-1 approvals of these gained joins that the `reviewed-approved` status records. The exemplar shows one of those approved ·It ~b~ ·It joins, which the rebuild no longer makes. The entry is kept as the record of this ruling.
    The gain it recorded: the old YAML puts the not_before [qsTea, qsIt, qsRoe] baseline-exit refusal only on the unentered stance (quikscript.yaml `entry_nowhere_exit_baseline`; the entered en-y5/ex-y0 stance has no such refusal), so a self-scoped refusal is the faithful transcription, and an entered ·It may join a following ·It or ·Tea at the baseline. The old font's break there comes from its chain of substitutions, not from an authored rule. The extended exit (ex-ext-1, the entered-exit extension) keeps the two verticals two columns apart, so the refusal's reason (one extra-thick stroke) does not apply. The classifier sends a gain with an entered ·It on its left here; an unentered-·It gain under ss03 (the ·It·May·Tea chains) goes to ss03-chain-join-gains, and one outside ss03 stays unmatched. The round-1 skips u-0397 and u-0399 ("I like the extra join but the extension between ·Tea and ·It shouldn't change because ·It joins to something else next") were answered by deleting qsIt's halves entry-extension record.
    The only divergence from the old font this ruling leaves is the ss04 ·X·It·It·Utter windows: the old font draws a baseline chain through both ·Its into ·Utter, and refuse records cannot be scoped to a feature, so the rebuild cannot carve it out. Those windows go to review as intended divergence.

- id: pea-chain-regularized
  status: reviewed-approved
  match: {predicate: pea_chain_regularized, configs: all}
  count: 101
  exemplars:
    - {config: default, codepoints: "E650:E650:E67A", baseline: "qsPea.half.en-y6.ex-y6|qsPea.en-y6|qsUtter (y6,break)", new: "qsPea.half.ex-y6|qsPea.full.en-y6.ex-y0|qsUtter.mono.en-y0 (y6,y0)"}
  why: |
    The classifier sends a row here when every seam it gains has a ·Pea on its left and it loses or moves none. The old font breaks after that ·Pea, and settlement joins it to the next letter, because capability and refusals permit the join and settlement maximizes the join count. The ·Pea follows an exit at one of two heights.
    After an x-height exit (·May, ·Utter or a `*_qsUtter` ligature), the old font draws the full qsPea.en-y5.ex-y0, whose one exit is at the baseline, and breaks before ·Pea and before ·J'ai (or the ·J'ai·Utter ligature). Settlement draws the half ·Pea and joins the follower: `·Utter ~x~ ·Pea.half ~6~ ·Pea` and `·Utter ~x~ ·Pea.half ~x~ ·J'ai`. Where the old font draws `·Utter ~x~ ·Pea | ·Pea.half ~x~ ·It`, settlement draws `·Utter ~x~ ·Pea.half ~6~ ·Pea.half ~x~ ·It`. The old font draws this ·Pea as the half qsPea.half.en-y5.ex-y5 before its x-height receivers other than ·J'ai, but it has no half ·Pea with an x-height entry and a y6 exit, so the ·Pea·Pea gain uses a cell the baseline never shows.
    After a y6 exit (half ·Pea or ·See), the old font draws the exitless qsPea.en-y6 before ·Utter, and under ss03 before a ·May that joins ·Tea: `·Pea.half ~6~ ·Pea | ·Utter`. Settlement gives that ·Pea the baseline exit the old font draws before its other baseline receivers (qsPea.en-y6.ex-y0): `·Pea.half ~6~ ·Pea ~b~ ·Utter`, and under ss03 `·Pea.half ~6~ ·Pea ~b~ ·May ~x~ ·Tea`.
    Round-1 verdict: 15 approvals.

