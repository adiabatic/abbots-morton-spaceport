  why: |
    The old pipeline's exit contractions before ·J'ai (by 1 on qsNo, qsLow and qsI, by 2 on qsAh, qsUtter and the `*_qsUtter` ligatures) are tucks, not trims: the compiled left glyph keeps its whole exit stroke and only the anchor moves in, pulling ·J'ai's crown over the kept ink. M1's contraction removes connector ink, and these exit strokes are too short to lose any (the ·Utter crown is exactly the two pixels a by-2 would take), so the runes put the tuck on the receiver: ·J'ai's own entry contracts, and the shortened crown gives up the columns the old font overlapped and abuts where the old one overlapped. Both forms place the same composite ink at the same coordinates with the same origins and advances. Only ·J'ai's cell name differs: it carries the con token where the old name put the contraction on the left (or, after ·Ah, the en-trim that the aliases already map). Where ·J'ai's exit also extends, the old font demotes its entry adjustment away entirely, and the runes' except-scoped entry records reproduce that, so this class sees only the left-side tucks that remain. ·Jay has the same crown and the same tuck after the unentered half-·Tea (the old `qsTea.half.ex-y5.ex-con-1` before ·Jay, whose alias records no adjustment), rewritten as ·Jay's own one-pixel entry contraction after ·Tea, and the ·Jay·Utter ligature inherits it on its lead.

