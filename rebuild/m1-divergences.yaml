- id: identical-jai-jay-crown
  title: "Looks identical: crown overlap before ·J’ai or ·Jay"
  summary: "The crown overlap before ·J’ai or ·Jay draws exactly as in the old font; only glyph names differ."
  status: by-design
  match: {predicate: jai_entry_contraction_renamed, configs: all}
  ink_identical: true
  exemplars:
    - {config: default, codepoints: "E67A:E65D", baseline: "qsUtter.ex-con-2|qsJai.en-y5.ex-y0", new: "qsUtter/mono/None/x-height/|qsJai/sole/x-height/None/en-con-2"}
