    The old compiled names keep anchors that never join: a dangling exit before a letter that does not accept it (·It·It's harmless ex-y5), or an entry name at word start. Settlement's cells carry only committed anchors (E-UNACCEPTED-EXIT and lookahead closure). The unjoined bindings involved are `safe`, so the ink is identical and the difference is at name grain only.

