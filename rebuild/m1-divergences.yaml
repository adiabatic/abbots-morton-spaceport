    - {config: ss03, codepoints: "E65A:E67B:E652", baseline: "qsSee.ex-y0.ex-con-1|qsOut.en-y0.ex-y5.after-see.before-other|qsTea.half.en-y5.after-xheight-exit (y0,y5)", new: "qsSee.ex-y0.ex-con-1|qsOut_qsTea.after-see (y0,lig)"}
  why: |
    The batch-11 ruling ("do what ·Tea·Oy does"): ·Out+Tea always forms. M1 formation does not depend on the configuration: the stylistic-set marker substitutions run after formation so that enabling a set cannot undo a ligature. The old font's ss03 splits the pair, because its calt substitutes the half-·Tea forward variant before its ligature pass runs (the `_LIGATURES_ALLOWING_SECOND_COMPONENT_FWD_VARIANTS` exception), so it renders `·Out ~x~ ·Tea.half` wherever half-·Tea can carry the join. The default configuration's behavior is the one the ligature exists for, so the rebuild keeps the ligature under ss03 too, and qsTea's two exit refusals keyed on an unjoined ·Out left implement that. The class takes every ss03 and ss03+ss05 window with a formable E67B:E652 adjacency that differs at ligation grain. The replaced old renderings are the sibling of the intended ss03 ·Fee·Tea divergence and were ruled on as a whole, so the class has `no_verdict`: no unit in it needs its own verdict.

- id: spacing-at-kerned-pairs
  title: "Spacing only, at kerned pairs"
  summary: "Joins and shapes match the old font; a letter sits a pixel closer or farther at a pair the old font kerned."
  status: per-unit
  match: {predicate: kern_out_of_scope, configs: all}
  exemplars: []
  why: |
    Position-only rows that the comparison marks kern-attributable. The oracle shapes every row whose junctions and ligation match against the new font and compares per-slot positions with the baseline, with sidecar kerns removed (KernEvaluator over glyph_data/senior_quikscript_kerning.yaml). What remains is a kern the normalization models differently from the old font, or a ZWNJ-adjacency artifact: the predicate requires the mismatched slots to sit on a kerned pair or a ZWNJ adjacency, and any other position mismatch stays unmatched. No class ruling covers these rows, so each unit takes its own verdict.
