# Declined-exit terminals for ·Utter, ·I, ·No, ·Day, ·Day·Utter, ·May, and ·Ah (E-DANGLE, "declined side has reaching ink and no withdrawal binding"). The shipped font draws each of these exit terminals whether or not the exit joins, glyph_data/quikscript.yaml has no exit-side withdrawn shape for them, and their runes declare no exit `withdrawal:`. The terminal pixel has no ink directly above or below it, so `geometry.verify_withdrawal_safe` does not accept it. These entries record the terminal as part of the letter. There is one signature per stance, entry, lock, and extension variant because the gate checks each cell separately; all show the same terminal.
- signature: dangle:qsUtter.mono:exit:x-height
  why: ·Utter's mono x-height terminal (top-right nub at y5), drawn unconditionally in the shipped font; the declined exit keeps it.
- signature: dangle:qsUtter.mono.en-y0:exit:x-height
  why: ·Utter entered at the baseline keeps the same mono x-height terminal on a declined exit.
- signature: dangle:qsUtter.mono.locked:exit:x-height
  why: The ZWNJ-locked twin of ·Utter's mono x-height terminal; identical drawing.

- signature: dangle:qsI.loop:exit:x-height
  why: ·I's loop x-height terminal (the top-right flick at y5, reached diagonally from the loop's right side), drawn in every context by the shipped font, which has no withdrawn ·I; the declined exit keeps it.
- signature: dangle:qsI.loop.en-y0:exit:x-height
  why: ·I entered at the baseline keeps the same loop x-height terminal on a declined exit.
- signature: dangle:qsI.loop.locked:exit:x-height
  why: The ZWNJ-locked twin of ·I's loop x-height terminal; identical drawing.
- signature: dangle:qsI.smaller-loop.en-y0:exit:x-height
  why: The smaller loop that ·I uses after some baseline joins (qsI's `prefer` records name the letters) has the same x-height terminal; the smaller loop leaves the flick where it is.

