# ·Bay's baseline closing bar is unconditional letterform ink, like ·Awe's tail above: it has the same shape whether or not the exit joins. The shipped font draws bare qsBay with the full below-baseline loop and its closing bar at every word edge and before every non-joining follower, and quikscript.yaml has no withdrawn form. The bar's last pixel sits one column right of the stem with no ink above or below it, so it fails the automatic `withdrawal: safe` check (`geometry.verify_withdrawal_safe`). The gate checks each entry and lock variant separately, so each has its own signature; all show the same terminal.
- signature: dangle:qsBay.hapax:exit:baseline
  why: ·Bay's closing-bar terminal, drawn unconditionally in the shipped font; the declined exit keeps it.
- signature: dangle:qsBay.hapax.en-y5:exit:baseline
  why: ·Bay entered at the x-height keeps the same closing-bar terminal on a declined exit.
- signature: dangle:qsBay.hapax.locked:exit:baseline
  why: The ZWNJ-locked twin of ·Bay's closing-bar terminal; identical drawing.

