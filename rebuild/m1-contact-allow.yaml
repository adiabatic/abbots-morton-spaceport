# The ·See·Out fusion at the baseline, in two defect formats: an E-CONTACT overlap and an E-UNREALIZED seam gap. ·See keeps its whole straighter tail, whose left-kicking last pixel fills the seam row. ·Out's raked redraws are one column shorter and entry-trimmed, so the leg fuses into the tail at (3, 1), one row above the baseline, and ·Out has no ink on the seam row. The overlap is the fusion, and the empty ·Out seam row is why `seam_gap` finds no ink there. The old font's `ex-con-1` on ·See is a tuck that keeps the tail's ink, so this reproduces the old font's fused ·See·Out and every after-·See form is pixel-identical to it (the see-out-fusion-respelled class in rebuild/m1-divergences.yaml).
