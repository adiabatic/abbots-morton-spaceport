# Reviewed signatures of defect-gate findings that are accepted as correct (doc/rebuild-design.md §9). `run_m1` loads the `signature` of every entry, and rebuild/pipeline/defects.py reports a finding whose signature is listed here as blessed instead of as an error. Each signature has the form defects.py builds for its gate: `contact:<left glyph>:<right glyph>:y<row>` or `:overlap` (E-CONTACT), `dangle:` (E-DANGLE), `unrealized:` (E-UNREALIZED), `anchor:` (E-ANCHOR), or `band:` (E-EXTENSION-BAND).
# Most entries are E-CONTACT off-anchor contacts that the shipped font also draws, on a join the old-font baseline shows. In a `contact:…:y<row>` signature the row is the first touching row the gate finds, and other rows may touch as well. The file is human-reviewed like rebuild/m1-divergences.yaml, and no pipeline step writes it. Nothing reports an entry whose finding no longer occurs.
# Agents write the `why:` fields in this file; the rule that only the user writes `why:` covers glyph_data/runes/qs*.yaml alone. Match the wording of the neighboring entries. The user reviews whether a signature belongs, not who wrote its `why:`.

