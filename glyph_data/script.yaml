  qsThey_qsUtter: {sequence: [qsThey, qsUtter]}
  qsFee: {codepoint: 0xE658}
  qsVie: {codepoint: 0xE659}
  qsSee: {codepoint: 0xE65A}
  qsSee_qsEat: {sequence: [qsSee, qsEat]}
  qsSee_qsUtter: {sequence: [qsSee, qsUtter]}
  qsZoo: {codepoint: 0xE65B}
  qsShe: {codepoint: 0xE65C}
  qsJai: {codepoint: 0xE65D}
