# Registries only, never policy (design section 2). The file holds no glyph records, so the font compile leaves it out of the glyph files by name (rebuild/pipeline/fingerprint.py's `font_data_paths`, tools/build_font.py's `load_glyph_data`).
heights: {baseline: 0, x-height: 5, y6: 6, top: 8}
boundary_tokens:
  space: {codepoint: 0x0020, splits_runs: true}
  zwnj: {codepoint: 0x200C, splits_runs: true}
  namer-dot: {codepoint: 0x00B7, splits_runs: false}
features:
  ss03: {kind: capability, description: "x-height exiters with a flat stroke reach ·Tea as the full bar"}
  ss04: {kind: capability, description: "·It joins at the baseline on both sides at once, any neighbor"}
  ss05: {kind: capability, description: "·Tea joins at the baseline on both sides at once, any neighbor"}
  ss06: {kind: taste, description: "an ·Owe that joins neither neighbor drawn with its ring open at the top", overlay: cosmetic}
  ss07: {kind: capability, description: "·Owe joins a following ·Day, ·Day+Utter or ·Day+Eat at the x-height"}
  ss08: {kind: taste, description: "·Key·Utter·May breaks after ·Key and takes the alternate ·Utter, as The Manual writes it"}
  ss10: {kind: taste, description: "isolated forms overlay", overlay: isolated}
  interactions: [[ss03, ss05]]
predicate_classes:
  halves-that-exit-at-x-height: {all: [{trait: half}, {can_exit_at: x-height}]}
  can-enter-at-baseline: {can_enter_at: baseline}
  can-enter-at-x-height: {can_enter_at: x-height}
  can-exit-at-baseline: {can_exit_at: baseline}
  can-exit-at-x-height: {can_exit_at: x-height}
  talls: {height_class: tall}
  shorts: {height_class: short}
  deeps: {height_class: deep}
# Each selector maps a letter followed by it to a glyph drawn from one stance of the letter's rune, in the fonts `fonts` names (cmap format 14): the stance's unjoined cell, or its base drawing where the stance has no unjoined cell, with no anchors either way, so settlement neither reads nor joins it.
variation_sequences:
- {selector: 0xFE00, fonts: [mono, junior, senior], runes: {qsUtter: alternate, qsNo: flipped}}
- selector: 0xFE01
  fonts: [senior]
  runes: {qsPea: half, qsTea: half, qsDay: half, qsHe: half, qsWay: half, qsWhy: half, qsZoo: half}
families:
  qsPea: {codepoint: 0xE650}
  qsBay: {codepoint: 0xE651}
  qsTea: {codepoint: 0xE652}
  qsTea_qsOy: {sequence: [qsTea, qsOy]}
  qsDay: {codepoint: 0xE653}
  qsDay_qsEat: {sequence: [qsDay, qsEat]}
  qsDay_qsUtter: {sequence: [qsDay, qsUtter]}
  qsKey: {codepoint: 0xE654}
  qsGay: {codepoint: 0xE655}
  qsThaw: {codepoint: 0xE656}
  qsThey: {codepoint: 0xE657}
