- predecessor_stance: qsExcite.ex-y0.before-vertical.after-baseline-letter
  trigger_stance: qsGay
  isolated_form: qsExcite.en-y0.noexit
  # ·Excite's `after-baseline-letter` stance, entered from a baseline-exit letter such as ·Awe, exits at the baseline toward a vertical follower. Across a break, the follower can settle on a stance with no baseline entry, so the exit dangles. These entries drop the exit and keep the baseline entry (`qsExcite.en-y0.noexit`). They do not cover the force-bad windows ·Awe·Excite·Tea·Jay, ·Awe·Excite·Tea·I, ·Awe·Excite·It·Day, and ·Awe·Excite·It·Utter, which stay in `site/bad-leak-backlog.txt`.
