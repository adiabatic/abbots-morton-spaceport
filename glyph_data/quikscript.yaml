context_sets:
  reaches_up_and_way_over_at_least_part_of_the_next_letter:
  - {family: qsI}
  - {family: qsAh, modifiers: [ex-ext-1]}
  - {family: qsUtter, modifiers: [ex-ext-1]}
  - {family: qsDay_qsUtter, modifiers: [ex-ext-1]}
  - {family: qsJai_qsUtter, modifiers: [ex-ext-1]}
  - {family: qsJay_qsUtter, modifiers: [ex-ext-1]}
  - {family: qsSee_qsUtter, modifiers: [ex-ext-1]}
  - {family: qsVie_qsUtter, modifiers: [ex-ext-1]}
  - {family: qsWay_qsUtter, modifiers: [ex-ext-1]}
  - {family: qsWhy_qsUtter, modifiers: [ex-ext-1]}
  # Used by ·Bay's x-height entry, which accepts any predecessor that reaches the x-height, including ·I, whose exit is one pixel past its own right edge. ·They, ·May, and ·They·Utter use `reaches_up_and_way_over...` instead. That set already contains `qsI`, so the two sets have the same members.
  reaches_up_and_a_little_over_at_least_part_of_the_next_letter:
  - {context_set: reaches_up_and_way_over_at_least_part_of_the_next_letter}
  - {family: qsI}
  vie_may_entry_extend_triggers:
  - {family: qsPea}
  - {family: qsTea}
  - {family: qsYe}
  - {family: qsHe}
  - {family: qsIt}
  utter_reaches_way_back_after: [{family: qsFee, modifiers: [ex-y5, before-utter]}, family: qsMay]
  xheight_exit_reaches_into_may: [{family: qsFee, modifiers: [ex-y5]}]
  utter_reaches_way_back_before: [family: qsSee, family: qsIng, family: qsNo, family: qsLow]
  utter_before_may:
  - {family: qsMay}
  - {family: qsMay, modifiers: [en-y0]}
  - {family: qsMay, modifiers: [en-y0, en-ext-1]}
  - {family: qsMay, modifiers: [en-y0, ex-ext-1]}
  - {family: qsMay, modifiers: [en-y0, en-ext-1, ex-ext-1]}
  halves_exit_xheight:
  - {family: qsPea, traits: [half]}
  - {family: qsTea, traits: [half], modifiers: [ex-y5]}
  - {family: qsTea, traits: [half], modifiers: [en-y8, ex-y5]}
  - {family: qsHe, traits: [half]}
  halves_exit_xheight_no_pea:
  - {family: qsTea, traits: [half], modifiers: [ex-y5]}
  - {family: qsTea, traits: [half], modifiers: [en-y8, ex-y5]}
  - {family: qsHe, traits: [half]}
  # The Quikscript letter families fall into three height classes:
  # - Short letters fit within the x-height (6-pixel bitmap, baseline at y=0).
  # - Tall letters rise 9 pixels from the baseline, one pixel above the cap height.
  # - Deep letters are also 9 pixels tall but sit with y_offset=-3, so they descend below the baseline.
  # Keep the `shorts`, `talls`, and `deeps` lists even where nothing selects them, because they record each letter's height class.
  shorts:
  - {family: qsNo}
  - {family: qsLow}
  - {family: qsRoe}
  - {family: qsLlan}
  - {family: qsIt}
  - {family: qsEat}
  - {family: qsEt}
  - {family: qsEight}
  - {family: qsAt}
  - {family: qsI}
  - {family: qsAh}
  - {family: qsAwe}
  - {family: qsOx}
  - {family: qsOy}
  - {family: qsUtter}
  - {family: qsOut}
  - {family: qsOwe}
  - {family: qsFoot}
  - {family: qsOoze}
  talls:
  - {family: qsPea}
  - {family: qsTea}
  - {family: qsKey}
  - {family: qsThaw}
  - {family: qsFee}
  - {family: qsSee}
  - {family: qsShe}
  - {family: qsCheer}
  - {family: qsYe}
  - {family: qsHe}
  - {family: qsIng}
  - {family: qsLoch}
  - {family: qsExcite}
  deeps:
  - {family: qsBay}
  - {family: qsDay}
  - {family: qsGay}
  - {family: qsThey}
  - {family: qsVie}
  - {family: qsZoo}
  - {family: qsJai}
  - {family: qsJay}
  - {family: qsWay}
  - {family: qsWhy}
  - {family: qsMay}
  - {family: qsExam}
  # Letters with no baseline entry after a Tall letter. ·Thaw's `noentry_after_tall` stance sets `entry: null` after `talls` (except ·-ing), although its `prop` record keeps an entry at y=0. A Tall letter should not take a baseline-exit stance toward one of these, because the follower has no entry to join.
  no_baseline_join_after_tall:
  - {family: qsThaw}
  # Letters whose right side runs straight down to the baseline, or tails off down and to the right, when they exit there. A follower whose baseline entry swings in from the left cannot curl behind them.
  flat_on_right_at_baseline:
  - {family: qsPea, exit_y: 0}
  - {family: qsTea, exit_y: 0}
  - {family: qsYe, exit_y: 0}
  - {family: qsHe, exit_y: 0}
  - {family: qsExcite, exit_y: 0}
  - {family: qsIt, exit_y: 0}
  - {family: qsIng, exit_y: 0}
  - {family: qsEat, exit_y: 0}
  - {family: qsEight, exit_y: 0}
  - {family: qsOx, exit_y: 0}
  - {family: qsOy, exit_y: 0}
  - {family: qsOoze, exit_y: 0}
  # The half letters that exit at the x-height (`halves_exit_xheight`: ·Pea, ·Tea, and ·He) plus ·I, whose exit is one pixel past its own right edge. After one of these, ·They and ·They·Utter lengthen their set-back x-height entry by one pixel (`extend_entry_after`).
  halves_and_i_exit_xheight:
  - {family: qsI}
  - {context_set: halves_exit_xheight}
  # The followers ·Gay reaches toward at the baseline. Before one of them, ·Gay's `exit_baseline` stance lengthens its exit by one pixel, and ·Gay's `entry_baseline` stance is not selected.
  gay_reaches_baseline_exit_forward:
  - {family: qsTea}
  - {family: qsDay}
  - {family: qsZoo}
  - {family: qsRoe}
  - {family: qsExam}
  - {family: qsIt}
  - {family: qsI}
  # Followers that don't accept the x-height exit of ·Tea's half stances, so those stances are not selected before them.
  followers_that_reject_tea_half_xheight_exit:
  - {family: qsTea}
  - {family: qsFee}
  - {family: qsCheer}
  - {family: qsYe}
  - {family: qsOwe}
  - {family: qsFoot}
  # Predecessors after which ·Excite drops its left-side join. Its entryless stances are selected after these letters.
  excite_drops_entry_after:
  - {family: qsPea}
  - {family: qsTea}
  - {family: qsYe}
  # Predecessors (·May, ·Utter) that exit at the x-height, so they join into ·Pea's x-height entry.
  xheight_exit_into_pea_xheight_entry: [{family: qsMay, exit_y: 5}, {family: qsUtter, exit_y: 5}]
restore_isolated_form_overrides:
  # Each entry covers a `prior target follower` sequence where a forward-pair `not_after` keeps `target` from being upgraded, but isolated shaping of `target follower` gives `isolated_form`. The emitter adds rules `sub [prior variants] target_stance' follower_variant by isolated_form;` under `calt_pair_guard_reflip_<target_base>`, where each `target_stance` is a forward replacement of `target` at an exit height that `isolated_form` lacks. The in-context result then matches the isolated one.
- {prior: qsNo, target: qsIt, follower: qsDay, isolated_form: qsIt.en-y5.ex-y0}
- {prior: qsJay, target: qsIt, follower: qsZoo, isolated_form: qsIt.ex-y0}
- {prior: qsJay, target: qsIt, follower: qsNo, isolated_form: qsIt.ex-y0}
- {prior: qsYe, target: qsIt, follower: qsZoo, isolated_form: qsIt.ex-y0}
- {prior: qsYe, target: qsIt, follower: qsNo, isolated_form: qsIt.ex-y0}
- {prior: qsIt, target: qsIt, follower: qsZoo, isolated_form: qsIt.ex-y0}
- {prior: qsEat, target: qsIt, follower: qsZoo, isolated_form: qsIt.ex-y0}
- {prior: qsEat, target: qsIt, follower: qsNo, isolated_form: qsIt.ex-y0}
predecessor_demote_overrides:
  # Each entry reverts a predecessor to `isolated_form` when the trigger after it is in a stance with no entry at the predecessor's exit height, so the predecessor's exit has nothing to join. Usually a later letter has stripped the trigger's entry. The pair `predecessor_stance trigger_stance` is enough to show the dangling exit, so most entries need no third glyph. Each entry compiles to `sub predecessor_stance' trigger_stance by isolated_form;` under `calt_pred_demote_<predecessor_base>`, or to `sub backtrack_stance predecessor_stance' trigger_stance by isolated_form;` when `backtrack_stance` is set. The emitter also applies each rule to the trigger's `.ex-ext-N` variants and runs the lookups again as `calt_final_pred_demote_*` and `calt_final2_pred_demote_*`.
- predecessor_stance: qsExcite.en-y0.ex-y0.before-vertical
  trigger_stance: qsIt.ex-y0.before-day.after-no-baseline-join
  isolated_form: qsExcite
- predecessor_stance: qsExcite.en-y0.ex-y0.before-vertical.noentry
