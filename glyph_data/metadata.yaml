metadata:
  font_name: Abbots Morton Spaceport
  version: 16.000
  copyright: © Nathan Galt, with glyphs from Departure Mono 1.500 © 2022–2024 Helena Zhang
  license: SIL Open Font License, Version 1.1
  license_url: https://openfontlicense.org/
  designer: Nathan Galt
  manufacturer: Nathan Galt
  vendor_url: https://github.com/adiabatic/abbots-morton-spaceport
  description: "An extension of Helena Zhang\u2019s Departure Mono for Quikscript. Available at <https://github.com/adiabatic/abbots-morton-spaceport>."

  # Matches Departure Mono. An em is 11 pixels of 50 units each, so the font renders pixel-perfect at multiples of 11px.
  units_per_em: 550

  # Font units per bitmap pixel: 550 / 11.
  pixel_size: 50

  # 11 pixels above the baseline, the full em. Matches Departure Mono.
  ascender: 550

  # 3 pixels below the baseline, the depth of the Deep letters and of Latin descenders such as g and p. Matches Departure Mono.
  descender: -150

  # 8 pixels, the top of flat capitals such as H and E. Matches Departure Mono.
  cap_height: 400

  # 6 pixels, the top of flat lowercase letters such as x and e. Matches Departure Mono.
  x_height: 300

  variation_sequences:
    0xFE00:  # VS1: alternate forms
      qsUtter: qsUtter.alt
      qsNo: qsNo.alt
    0xFE01:  # VS2: half-letters
      qsPea: qsPea.prop.half
      qsTea: qsTea.half
      qsDay: qsDay.half
      qsHe: qsHe.half
      qsWay: qsWay.half
      qsWhy: qsWhy.half
      qsZoo: qsZoo.half

  # Name ID 19, the text font managers show in previews.
  sample_text: "\uE657\uE65A \uE65B \uE657 \uE661\uE673 \uE652 \uE653 \uE670" # reads "this is the way to do it"
