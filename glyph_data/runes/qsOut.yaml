rune: qsOut
codepoint: 0xE67B
ductus:
  normal: |
    Begun at the left end of the baseline, where a previous letter may connect, the stroke climbs diagonally up and to the right to the letter’s crown at the x-height, runs rightward along the crown, and descends the right side, curling back in toward the letter in a loop.
  swept-up: |
    As the normal motion, but finish the loop rightwards, at the x-height, where it connects to the next letter.
mono:
  bitmap:
  - "   # "  #
  - "  # #"
  - " # # "
  - "#    "
  - "#    "
  - "#    "  #
stances:
  normal:
    motion: normal
    traits: []
    bitmap:
    - "    ### "  #
    - "   ##  #"
    - "  # #  #"
    - " #   ## "
    - "#       "
    - "#       "  #
    surface:
      entries:
        baseline:
          x: 0
          stroke: vertical
          from:
          - class: can-exit-at-baseline
            except:
            - {family: qsThaw}
            - {family: qsVie}
            - {family: qsRoe}
            - {family: qsAt}
      cells: []
      unlocks: []
      require: []
  swept-up:
    motion: swept-up
    traits: []
    bitmap:
    - "   ##"  #
    - "  #  "
    - " # # "
    - "# #  "
    - "#    "
    - "#    "  #
    bitmaps:
      low-bend:
        bitmap:
        - "    ##"  #
        - "   #  "
        - "  # # "
        - " # #  "
        - "#     "
        - "#     "  #
    surface:
      entries:
        baseline:
          x: 0
          stroke: vertical
          from:
          - class: can-exit-at-baseline
            except:
            - {family: qsThaw}
            - {family: qsVie}
            - {family: qsRoe}
            - {family: qsAt}
      exits:
        x-height:
          x: 5
          stroke: horizontal
          toward:
          - family:
            - qsDay
            - qsDay_qsEat
            - qsDay_qsUtter
            - qsFee
            - qsZoo
            - qsJai
            - qsJai_qsUtter
            - qsCheer
            - qsJay
            - qsJay_qsUtter
            - qsYe
            - qsNo
            - qsRoe
            - qsLlan
            - qsEt
            - qsEight
            - qsAwe
            - qsOx
            - qsOy
            - qsFoot
      cells: []
      unlocks: []
      require: []
policy:
  order:
  - normal
  - swept-up
  refuse: []
  prefer:
  - cell: {exit: x-height}
    over: {exit: none}
    when:
      right:
        except:
        - {family: qsFee}
  extend:
  - exit: x-height
    by: 1
    when:
      right: {family: qsFee}
  contract:
  - stance: normal
    entry: baseline
    trim: 1
    why: I'd like to recreate the old look of ·See·Out.
    when:
      left: {family: qsSee}
  - stance: swept-up
    entry: baseline
    bind: low-bend
    trim: 1
    when:
      left: {family: qsSee}
  resolve: []
  groups: {}
kern:
- {right: {family: qsBay}, by: -3}
- {right: {family: qsVie}, by: -1}
- {right: {family: qsWay}, by: -2}
- {right: {family: qsWhy}, by: -2}
- {right: {family: qsIng}, by: -1}
- {right: {family: qsMay}, by: -1}
- {right: {family: qsLow}, by: -1}
- {right: {family: qsAt}, by: -2}
- {right: {family: qsAh}, by: -2}
- {right: {family: qsOut}, by: -1}
