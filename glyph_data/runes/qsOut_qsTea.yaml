rune: qsOut_qsTea
sequence:
- qsOut
- qsTea
ductus:
  sole: |
    The ·Out stroke and the ·Tea stroke drawn as one motion: the ·Out bowl rises from the baseline as in the normal motion, loops around clockwise, and then ends going straight up.
notes: |
  This letter doesn’t have any exits by design.
stances:
  sole:
    motion: sole
    outgoing: {exception: The ligature ends in the upward stroke documented by its ductus and has no outgoing stroke.}
    traits: []
    bitmap:
    - "    #   "
    - "    #   "
    - "    #   "
    - "   #### "  #
    - "  # #  #"
    - " #  #  #"
    - "#    ## "
    - "#       "
    - "#       "  #
    bitmaps:
      raked:
        bitmap:
        - "     #   "
        - "     #   "
        - "     #   "
        - "     ### "  #
        - "    ##  #"
        - "   # #  #"
        - "  #   ## "
        - " #       "
        - " #       "  #
    surface:
      entries:
        baseline:
          x: 0
          stroke: vertical
          from:
          - class: can-exit-at-baseline
            except:
            - {family: qsThaw}
            - {family: qsVie}
            - {family: qsRoe}
            - {family: qsAt}
      cells: []
      unlocks: []
      require: []
policy:
  order:
  - sole
  refuse: []
  prefer: []
  extend: []
  contract:
  - entry: baseline
    bind: raked
    trim: 1
    when:
      left: {family: qsSee}
  resolve: []
  groups: {}
