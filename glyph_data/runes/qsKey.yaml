rune: qsKey
codepoint: 0xE654
ductus:
  sole: |
    Begun at the top left, the stroke slants down and inward to a point at the middle, falls straight down past the x-height, slants back out to the left, drops to the baseline, and turns rightward into a foot, where it may connect to the next letter.
mono:
  bitmap:
  - "#    "
  - " #   "
  - "  #  "
  - "  #  "  #
  - "  #  "
  - " #   "
  - "#    "
  - "#    "
  - " ### "  #
stances:
  sole:
    motion: sole
    traits: []
    bitmap:
    - "#   "
    - " #  "
    - "  # "
    - "  # "  #
    - "  # "
    - " #  "
    - "#   "
    - "#   "
    - " ###"  #
    surface:
      entries:
        top:
          x: 0
          stroke: diagonal
          from:
          - {family: qsSee}
      exits:
        baseline:
          x: 4
          stroke: horizontal
          toward:
          - class: can-enter-at-baseline
            except:
            - {family: qsPea}
            - {family: qsThaw}
      cells: []
      unlocks: []
      require: []
policy:
  order:
  - sole
  refuse: []
  prefer: []
  extend: []
  contract:
  - exit: baseline
    by: 1
    when:
      right:
        family:
        - qsMay
        - qsNo
        - qsIt
  resolve: []
  groups: {}
kern:
- {right: {family: qsEt}, by: -1}
- {right: {family: qsEight}, by: -1}
- {right: {family: qsAwe}, by: -1}
- {right: {family: qsOx}, by: -1}
- {right: {family: qsOy}, by: -1}
- {right: {family: qsFoot}, by: -1}
