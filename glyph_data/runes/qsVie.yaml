rune: qsVie
codepoint: 0xE659
ductus:
  normal: |
    Begun at the left end of the baseline bar, where a previous letter may connect, the stroke runs rightward along the baseline, rises up the right side of the bowl, and arcs leftward over the top at the x-height. It then descends the left side, crossing the bar into the descender, where it curls rightward along the bottom and back up, ending at the cup’s right lip just below the baseline.
  swept-out: |
    As the normal motion, but instead of ending at the descender cup’s right lip, the stroke keeps climbing up and to the right, out of the descender and onto the baseline, where it connects to the next letter.
mono:
  bitmap:
  - " ### "  #
  - "#   #"
  - "#   #"
  - "#   #"
  - "#  # "
  - "###  "  #
  - "#    "
  - "#   #"
  - " ### "
  y_offset: -3
stances:
  normal:
    motion: normal
    traits: []
    bitmap:
    - "  ### "  #
    - " #   #"
    - " #   #"
    - " #   #"
    - " #  # "
    - "####  "  #
    - " #    "
    - " #   #"
    - "  ### "
    y_offset: -3
    surface:
      entries:
        baseline:
          x: 0
          stroke: horizontal
      cells: []
      unlocks: []
      require: []
  swept-out:
    motion: swept-out
    traits: []
    bitmap:
    - "  ###   "  #
    - " #   #  "
    - " #   #  "
    - " #   #  "
    - " #  #   "
    - "####   #"  #
    - " #    # "
    - " #   #  "
    - "  ###   "
    y_offset: -3
    surface:
      entries:
        baseline:
          x: 0
          stroke: horizontal
      exits:
        baseline:
          x: 8
          stroke: diagonal
          toward:
          - family:
            - qsIng
            - qsNo
            - qsLow
            - qsRoe
            - qsExcite
      cells: []
      unlocks: []
      require: []
policy:
  order:
  - normal
  - swept-out
  refuse: []
  prefer: []
  extend:
  - stance: normal
    entry: baseline
    by: 1
    when:
      left:
        family:
        - qsPea
        - qsTea
        - qsYe
        - qsHe
        - qsIt
  - stance: swept-out
    entry: baseline
    by: 1
    when:
      left:
        family:
        - qsPea
        - qsTea
        - qsYe
        - qsHe
        - qsIt
  contract: []
  resolve: []
  groups: {}
