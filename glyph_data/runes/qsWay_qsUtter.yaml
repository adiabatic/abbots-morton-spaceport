    outgoing: {stance: mono}
    traits: []
    bitmap:
    - "    ##"  #
    - "   #  "
    - "  #   "
    - "  #   "
    - " #    "
    - " #    "  #
    - "#     "
    - "#     "
    - "#     "
    y_offset: -3
    surface:
      entries: {}
      exits:
        x-height:
          x: 6
          stroke: horizontal
      cells: []
      unlocks: []
      require: []
policy:
  order:
  - sole
  refuse: []
  prefer: []
  extend:
  - exit: x-height
    by: 1
    when:
      right: {family: qsGay}
  contract: []
  resolve: []
  groups: {}
