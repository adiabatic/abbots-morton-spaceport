rune: qsWay_qsUtter
sequence:
- qsWay
- qsUtter
ductus:
  sole: | # DRAFT — pending author sign-off
    The ·Way stroke and the ·Utter stroke drawn as one motion: begun at the bottom of the descender on the left, the stroke rises up and to the right across the baseline as in ·Way, then finishes with ·Utter’s short rightward crown at the x-height, where it may connect to the next letter.
stances:
