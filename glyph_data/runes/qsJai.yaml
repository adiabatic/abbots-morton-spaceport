rune: qsJai
codepoint: 0xE65D
ductus:
  hapax: |
    Begun at the left end of the crown bar at the x-height, where a previous letter may connect, the stroke runs rightward along the crown, turns down the right side, and descends, slanting gently leftward, through the baseline into the descender. At the bottom it curls: leftward, then up and back to the right, crossing its own downstroke, to rejoin the baseline, along which it runs rightward and ends, where it may connect to the next letter.
mono:
  bitmap:
  - "#### "  #
  - "    #"
  - "    #"
  - "   # "
  - "   # "
  - " ####"  #
  - "# #  "
  - "# #  "
  - " #   "
  y_offset: -3
stances:
  hapax:
    motion: hapax
    traits: []
    bitmap:
    - " #### "  #
    - "     #"
    - "     #"
    - "    # "
    - "    # "
    - "  ####"  #
    - " # #  "
    - "# #   "
    - " #    "
    y_offset: -3
    surface:
      entries:
        x-height:
          x: 1
          stroke: horizontal
          from:
          - family:
            - qsPea
            - qsTea
            - qsDay_qsUtter
            - qsGay
            - qsFee
            - qsVie_qsUtter
            - qsSee_qsUtter
            - qsJai_qsUtter
            - qsMay
            - qsNo
            - qsLow
            - qsRoe
            - qsIt
            - qsAt
            - qsI
            - qsAh
            - qsUtter
            - qsOut
      exits:
        baseline:
          x: 6
          stroke: horizontal
          toward:
          - family:
            - qsTea
            - qsDay
            - qsDay_qsUtter
            - qsGay
            - qsVie
            - qsVie_qsUtter
            - qsSee
            - qsMay
            - qsNo
            - qsLow
            - qsRoe
            - qsIt
            - qsAt
            - qsI
            - qsAh
            - qsOut
            - qsOut_qsTea
            - qsOoze
      cells: []
      unlocks: []
      require: []
policy:
  order:
  - hapax
  refuse: []
  prefer:
  - cell: {exit: none}
    over: {exit: baseline}
    when:
      right:
        family: qsTea
        then:
          except:
          - {family: qsPea}
  extend:
  - exit: baseline
    by: 1
    when:
      right:
        family:
        - qsTea
        - qsThaw
        - qsYe
        - qsIng
        - qsRoe
        - qsExam
        - qsIt
        - qsI
  - entry: x-height
    by: 2
    when:
      left: {family: qsGay}
      right:
        except:
        - {family: qsTea}
        - {family: qsThaw}
        - {family: qsVie}
        - {family: qsVie_qsUtter}
        - {family: qsSee}
        - {family: qsYe}
        - {family: qsIng}
        - {family: qsNo}
        - {family: qsLow}
        - {family: qsRoe}
        - {family: qsExam}
        - {family: qsIt}
        - {family: qsI}
  contract:
  - entry: x-height
    by: 1
    when:
      left:
        family:
        - qsPea
        - qsTea
  - entry: x-height
    by: 1
    when:
      left:
        family:
        - qsThey
        - qsHe
      right:
        except:
        - {family: qsTea}
        - {family: qsThaw}
        - {family: qsVie}
        - {family: qsVie_qsUtter}
        - {family: qsSee}
        - {family: qsYe}
        - {family: qsIng}
        - {family: qsNo}
        - {family: qsLow}
        - {family: qsRoe}
        - {family: qsExam}
        - {family: qsIt}
        - {family: qsI}
  - entry: x-height
    by: 1
    when:
      left:
        family:
        - qsNo
        - qsLow
        - qsAt
        - qsI
  - entry: x-height
    by: 2
    when:
      left:
        family:
        - qsAh
        - qsUtter
  resolve: []
  groups: {}
