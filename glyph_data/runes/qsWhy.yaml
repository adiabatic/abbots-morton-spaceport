    traits: []
    bitmap:
    - "    #"  #
    - "    #"
    - "    #"
    - "   # "
    - "   # "
    - "   # "  #
    - "# #  "
    - " ##  "
    - "  #  "
    y_offset: -3
    bitmaps:
      curved-at-top:
        bitmap:
        - "     #"  #
        - "    # "
        - "    # "
        - "   #  "
        - "   #  "
        - "   #  "  #
        - "# #   "
        - " ##   "
        - "  #   "
        y_offset: -3
    surface:
