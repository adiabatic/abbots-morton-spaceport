rune: qsWhy
codepoint: 0xE663
ductus:
  full: | # DRAFT — pending author sign-off
    Begun at the top of the short left arm just below the baseline, the stroke runs down and to the right to the bottom of the descender, turns, and climbs up and to the right in one long stroke across the baseline to the x-height. The top stands upright in isolation and bends rightward when it connects to the next letter at the x-height.
  half: | # DRAFT — pending author sign-off
    As the full motion, but only the part below the baseline is drawn: begun at the top of the short left arm, the stroke runs down and to the right to the bottom of the descender, turns, and climbs up and to the right at the same slope, ending just below the baseline, where it connects to the next letter at the baseline.
mono:
  bitmap:
  - "    #"  #
  - "    #"
  - "    #"
  - "   # "
  - "   # "
  - "   # "  #
  - "# #  "
  - " ##  "
  - "  #  "
  y_offset: -3
stances:
  full:
    motion: full
    traits: []
    bitmap:
    - "    #"  #
    - "    #"
    - "    #"
    - "   # "
    - "   # "
    - "   # "  #
    - "# #  "
    - " ##  "
    - "  #  "
    y_offset: -3
    bitmaps:
      curved-at-top:
        bitmap:
        - "     #"  #
        - "    # "
        - "    # "
        - "   #  "
        - "   #  "
        - "   #  "  #
        - "# #   "
        - " ##   "
        - "  #   "
        y_offset: -3
    surface:
      entries: {}
      exits:
        x-height:
          x: 6
          stroke: diagonal
          unjoined: safe
          toward:
          - family:
            - qsDay
            - qsDay_qsUtter
            - qsZoo
            - qsJai
            - qsJai_qsUtter
            - qsJay
            - qsJay_qsUtter
            - qsNo
            - qsRoe
            - qsLlan
            - qsIt
            - qsEt
            - qsEight
            - qsAwe
            - qsOx
            - qsFoot
      cells:
      - entry: none
        exit: x-height
        bitmap: curved-at-top
      unlocks: []
      require: []
  half:
    motion: half
    traits:
    - half
    bitmap:
    - "     "  #
    - "     "
    - "     "
    - "     "
    - "     "
    - "     "  #
    - "#   #"
    - " # # "
    - "  #  "
    y_offset: -3
    surface:
      entries: {}
      exits:
        baseline:
          x: 5
          ink_y: -1
          stroke: diagonal
          toward:
          - {family: qsGay}
      cells: []
      unlocks: []
      require:
      - exit
policy:
  order:
  - full
  - half
  refuse: []
  prefer:
  - cell: {exit: baseline}
    over: {exit: none}
    when:
      right:
        family: qsGay
        then:
          family:
          - qsGay
          - qsThaw
          - qsVie
          - qsVie_qsUtter
          - qsSee
          - qsMay
          - qsLow
          - qsAt
          - qsAh
          - qsUtter
  extend: []
  contract: []
  resolve: []
  groups: {}
