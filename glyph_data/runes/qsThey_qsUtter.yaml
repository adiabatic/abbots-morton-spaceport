rune: qsThey_qsUtter
sequence:
- qsThey
- qsUtter
ductus:
  hapax: |
    The ·They stroke and the ·Utter stroke drawn as one motion: the ·They part as usual from the top down into its descender hook, but instead of ending at the hook's tip, the stroke keeps climbing diagonally up and to the right, out of the descender and past the baseline, and finishes with ·Utter’s short rightward crown at the x-height, where it may connect to the next letter.
stances:
  hapax:
    motion: hapax
    outgoing:
      stance: mono
      exceptions:
        surface.exits.x-height: The ligature keeps its authored follower scope for its combined stroke.
        policy.extend[0]: The ligature's outgoing arm uses its declared endpoint without a contextual extension.
        policy.extend[1]: The ligature's outgoing arm uses its declared endpoint under ss03 without a contextual extension.
    traits: []
    bitmap:
    - "  #      ##"  #
    - "  #     #  "
    - " #     #   "
    - " #    #    "
    - " #   #     "
    - "#    #     "  #
    - "#   #      "
    - "#   #      "
    - " ###       "
    y_offset: -3
    surface:
      entries:
        x-height:
          x: 2
          stroke: vertical
          from:
          - family:
            - qsI
            - qsAh
            - qsUtter
      exits:
        x-height:
          x: 11
          stroke: horizontal
          toward:
          - family:
            - qsPea
            - qsTea
            - qsDay
            - qsDay_qsUtter
            - qsGay
            - qsThey_qsUtter
            - qsZoo
            - qsJai
            - qsJai_qsUtter
            - qsCheer
            - qsMay
            - qsNo
            - qsRoe
            - qsIt
            - qsEt
            - qsEight
            - qsAwe
            - qsOx
            - qsOy
            - qsUtter
      cells: []
      unlocks: []
      require: []
policy:
  order:
  - hapax
  refuse: []
  prefer: []
  extend: []
  contract: []
  resolve: []
  groups: {}
