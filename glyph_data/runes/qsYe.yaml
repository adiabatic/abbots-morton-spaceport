rune: qsYe
codepoint: 0xE660
ductus:
  loop: |
    - Begun at the left just above the x-height, the stroke draws a counterclockwise loop — rightward along the bottom, up the right side, leftward over the top, and down the left side — then crosses back over its own start and runs straight down the stem to the baseline, where it may connect to the next letter.
    - Entered from a previous letter at the foot of the stem on the baseline, the stroke climbs the stem and draws the same loop, but clockwise — rightward along the top, down the right side, leftward along the bottom — then crosses the upward stroke and finishes at the left just above the x-height.
  climbing-loop: |
    Entered from the left at the x-height, the stroke turns up into a counterclockwise loop — rightward along the bottom, up the right side, leftward over the top, and down the left side back to the stem — then runs straight down the stem to the baseline, where it may connect to the next letter.
