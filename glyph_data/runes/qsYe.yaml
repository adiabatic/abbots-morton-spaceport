policy:
  order:
  - loop
  - climbing-loop
  refuse: []
  prefer:
  - cell:
      entry: none
      exit: baseline
    over:
      entry: baseline
      exit: none
    when:
      left: {class: can-exit-at-baseline}
      right:
        family:
        - qsDay
        - qsDay_qsUtter
        - qsVie
        - qsVie_qsUtter
        - qsSee
        - qsZoo
        - qsIng
        - qsMay
        - qsNo
        - qsLow
        - qsRoe
        - qsEat
        - qsAt
        - qsI
        - qsAh
        - qsUtter
        - qsOut
        - qsOut_qsTea
        - qsOoze
        except:
        - family: qsAt
          then: {family: qsMay}
        - family: qsUtter
          then:
            family:
            - qsThaw
            - qsVie
            - qsVie_qsUtter
            - qsSee
            - qsIng
            - qsMay
            - qsLow
            - qsExcite
            - qsExam
            - qsEat
            - qsAt
            - qsI
            - qsAh
            - qsOut
            - qsOoze
  extend:
  - stance: loop
    exit: baseline
    by: 1
    when:
      right: {family: qsI}
  - stance: climbing-loop
    exit: baseline
    by: 1
    when:
      right: {family: qsI}
  contract: []
  resolve: []
  groups: {}
