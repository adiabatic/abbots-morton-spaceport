rune: qsAh
codepoint: 0xE676
ductus:
  sole: |
    Begun at the left along the baseline, the stroke runs briefly rightward, then climbs up and to the right in a sigmoid curve and finishes rightward at the x-height.
mono:
  bitmap:
  - "   ##"  #
  - "  #  "
  - "  #  "
  - "  #  "
  - "  #  "
  - "##   "  #
stances:
  sole:
    motion: sole
    traits: []
    bitmap:
    - "     ##"  #
    - "    #  "
    - "   #   "
    - "   #   "
    - "  #    "
    - "##     "  #
    surface:
      entries:
        baseline:
          x: 0
          stroke: horizontal
          from:
          - class: can-exit-at-baseline
            except:
            - {family: qsThaw}
            - {family: qsVie}
            - {family: qsSee}
            - {family: qsAt}
      exits:
        x-height:
          x: 7
          stroke: horizontal
      cells: []
      unlocks: []
      require: []
policy:
