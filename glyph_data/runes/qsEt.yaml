rune: qsEt
codepoint: 0xE672
ductus:
  sole: |
    Begun at the left at the x-height, the stroke runs down in a counterclockwise arc and exits at the baseline.
mono:
  bitmap:
  - "#    "  #
  - "#    "
  - "#    "
  - " #   "
  - "  #  "
  - "   ##"  #
stances:
  sole:
    motion: sole
    traits: []
    bitmap:
    - "#    "  #
    - "#    "
    - "#    "
    - " #   "
    - "  #  "
    - "   ##"  #
    surface:
      entries:
        x-height:
          x: 0
          stroke: vertical
      exits:
        baseline:
          x: 5
          stroke: horizontal
      cells: []
      unlocks: []
      require: []
policy:
  order:
  - sole
  refuse: []
  prefer:
  - cell: {exit: none}
    over: {exit: baseline}
    when:
      right:
        family: qsPea
        then:
          family: qsIt
          then: {family: qsIng}
  extend:
  - entry: x-height
    by: 1
    when:
      left:
        family:
        - qsPea
        - qsTea
        - qsHe
  contract:
  - exit: baseline
    by: 1
    when:
      right: {family: qsGay}
  - exit: baseline
    by: 1
    when:
      right: {family: qsMay}
  resolve: []
  groups: {}
kern:
- {right: {family: qsPea, stance: full}, by: -3}
- {right: {family: qsPea, stance: half, exit: x-height}, by: -3}
- {right: {family: qsPea, stance: half, exit: y6}, by: -3}
- {right: {family: qsLlan}, by: -1}
- {right: {family: qsEt}, by: -2}
- {right: {family: qsEight}, by: -2}
- {right: {family: qsAwe}, by: -2}
- {right: {family: qsOx}, by: -2}
- {right: {family: qsOy}, by: -1}
