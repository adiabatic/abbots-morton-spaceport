rune: qsEt
codepoint: 0xE672
ductus:
  sole: |
    Begun at the left at the x-height, the stroke runs down in a counterclockwise arc and exits at the baseline.
mono:
  bitmap:
  - "#    "  #
  - "#    "
  - "#    "
  - " #   "
  - "  #  "
  - "   ##"  #
stances:
  sole:
    motion: sole
    traits: []
    bitmap:
    - "#    "  #
    - "#    "
    - "#    "
    - " #   "
    - "  #  "
    - "   ##"  #
    surface:
      entries:
        x-height:
          x: 0
          stroke: vertical
      exits:
        baseline:
          x: 5
          stroke: horizontal
      cells: []
      unlocks: []
      require: []
policy:
  order:
  - sole
  refuse: []
  prefer: []
  extend:
  - entry: x-height
    by: 1
    when:
      left:
        family:
        - qsPea
        - qsTea
        - qsHe
  contract:
  - exit: baseline
    by: 1
    when:
      right: {family: qsGay}
  - exit: baseline
    by: 1
    when:
      right: {family: qsMay}
  resolve: []
  groups: {}
