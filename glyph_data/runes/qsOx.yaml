rune: qsOx
codepoint: 0xE678
ductus:
  sole: |
    Begun at the left along the x-height, the stroke runs rightward and down in a vaguely parabolic arc.
mono:
  bitmap:
  - "##   "  #
  - "  #  "
  - "   # "
  - "   # "
  - "    #"
  - "    #"  #
stances:
  sole:
    motion: sole
    traits: []
    bitmap:
    - "##   "  #
    - "  #  "
    - "   # "
    - "   # "
    - "    #"
    - "    #"  #
    surface:
      entries:
        x-height:
          x: 0
          stroke: horizontal
          from:
          - {class: can-exit-at-x-height}
      exits:
        baseline:
          x: 5
          stroke: vertical
          unjoined: safe
          toward:
          - class: can-enter-at-baseline
            except:
            - {family: qsPea}
            - {family: qsGay}
      cells: []
      unlocks: []
      require: []
policy:
  order:
  - sole
  refuse: []
  prefer:
  - cell: {exit: none}
    over: {exit: baseline}
    when:
      right:
        family: qsTea
        then:
          except:
          - {family: qsPea}
          - family: qsIt
            then:
              family:
              - qsDay
              - qsDay_qsUtter
              - qsZoo
              - qsJai
              - qsJai_qsUtter
              - qsCheer
              - qsJay
              - qsJay_qsUtter
              - qsRoe
              - qsLlan
              - qsEight
              - qsI
              - qsAwe
              - qsOx
              - qsUtter
              - qsOwe
              - qsFoot
  extend: []
  contract: []
  resolve: []
  groups: {}
