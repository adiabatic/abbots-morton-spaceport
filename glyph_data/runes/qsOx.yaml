rune: qsOx
codepoint: 0xE678
ductus:
  hapax: |
    Begun at the left along the x-height, the stroke runs rightward and down in a vaguely parabolic arc.
mono:
  bitmap:
  - "##   "  #
  - "  #  "
  - "   # "
  - "   # "
  - "    #"
  - "    #"  #
stances:
  hapax:
    motion: hapax
    traits: []
    bitmap:
    - "##   "  #
    - "  #  "
    - "   # "
    - "   # "
    - "    #"
    - "    #"  #
    surface:
      entries:
        x-height:
          x: 0
          stroke: horizontal
          from:
          - family:
            - qsPea
            - qsTea
            - qsDay_qsUtter
            - qsGay
            - qsFee
            - qsVie_qsUtter
            - qsSee_qsUtter
            - qsJai_qsUtter
            - qsMay
            - qsNo
            - qsLow
            - qsRoe
            - qsIt
            - qsAt
            - qsI
            - qsAh
            - qsUtter
            - qsOut
      exits:
        baseline:
          x: 5
          stroke: vertical
          withdrawal: safe
          toward:
          - family:
            - qsTea
            - qsDay
            - qsDay_qsUtter
            - qsVie
            - qsVie_qsUtter
            - qsSee
            - qsMay
            - qsNo
            - qsLow
            - qsRoe
            - qsIt
            - qsAt
            - qsI
            - qsAh
            - qsUtter
