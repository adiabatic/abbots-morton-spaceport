      cells: []
      unlocks: []
      require: []
policy:
  order:
  - hapax
  refuse: []
  prefer:
  - cell: {exit: none}
    over: {exit: baseline}
    when:
      right:
        family: qsTea
        then:
          except:
          - {family: qsPea}
  extend:
  - entry: x-height
    by: 1
    when:
      left:
        family:
        - qsTea
        - qsHe
  contract: []
  resolve: []
  groups: {}
