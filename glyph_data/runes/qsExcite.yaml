rune: qsExcite
codepoint: 0xE66B
ductus:
  sole: |  # DRAFT — pending author sign-off
    Begun at the bottom left on the baseline, where a previous letter may connect, the first stroke rises up and to the right through the crossing point at mid-height and ends at the x-height on the right. The pen lifts, and the second stroke begins at the top left, falls straight down to just above the x-height, then angles down and to the right through the crossing point to rest on the baseline at the bottom right, where it may connect to the next letter. Each foot splays one column outward when it connects at the baseline.
mono:
  bitmap:
  - "#    "
  - "#    "
  - "#    "
  - " #  #"  #
  - " # # "
  - "  #  "
  - " # # "
  - "#   #"
  - "#   #"  #
stances:
  sole:
    motion: sole
    traits: []
    bitmap:
    - "#    "
    - "#    "
    - "#    "
    - " #  #"  #
    - " # # "
    - "  #  "
    - " # # "
    - "#   #"
    - "#   #"  #
    bitmaps:
      wide-at-baseline:
