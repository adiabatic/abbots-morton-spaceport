        - "#     "
        - "#     "
        - "#     "
        - " #  # "  #
        - " # #  "
        - "  #   "
        - " # #  "
        - "#   # "
        - "#    #"  #
    surface:
      entries:
        baseline:
          x: 0
          stroke: diagonal
          joined: wide-on-left-at-baseline
          from:
          - family:
            - qsBay
            - qsDay
            - qsKey
            - qsVie
            - qsZoo
            - qsShe
            - qsJai
            - qsCheer
            - qsJay
            - qsIng
