            - qsI
            - qsAh
            - qsUtter
            - qsOut
            - qsOut_qsTea
            - qsOoze
      cells:
      - entry: none
        exit: baseline
        bitmap: wide-on-right-at-baseline
      - entry: baseline
        exit: baseline
        bitmap: wide-at-baseline
        exit_x: 7
      unlocks: []
      require: []
policy:
  order:
  - sole
  refuse: []
  prefer:
  - cell: {exit: none}
    over: {exit: baseline}
    when:
      right:
        family: qsTea
        then:
          except:
          - {family: qsPea}
          - family: qsIt
            then:
              family:
              - qsDay
              - qsDay_qsUtter
              - qsZoo
              - qsJai
              - qsJai_qsUtter
              - qsCheer
              - qsJay
              - qsJay_qsUtter
              - qsRoe
              - qsLlan
              - qsEight
              - qsI
              - qsAwe
              - qsOx
              - qsUtter
              - qsOwe
              - qsFoot
  extend: []
  contract: []
  resolve: []
  groups: {}
