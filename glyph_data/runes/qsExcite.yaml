            - qsEat
            - qsEt
            - qsEight
            - qsAwe
            - qsOx
            - qsOy
            - qsUtter
            - qsOoze
            except:
            - {family: qsThey_qsZoo}
      exits:
        baseline:
          x: 6
          stroke: diagonal
          unjoined: safe
          toward:
          - family:
            - qsTea
            - qsDay
            - qsDay_qsUtter
            - qsVie
            - qsSee
            - qsZoo
            - qsIng
            - qsMay
            - qsNo
            - qsLow
