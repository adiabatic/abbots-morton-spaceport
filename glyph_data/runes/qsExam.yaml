    Begun at the bottom left on the baseline, where a previous letter may connect, the first stroke rises diagonally up and to the right through the crossing point to the x-height. The pen lifts, and the second stroke begins at the top left at the x-height, goes diagonally down and to the right through the crossing point to the baseline to the bottom of the descender.
