rune: qsFoot
codepoint: 0xE67D
ductus:
  sole: |
    Begun at the top left at the x-height, where a previous letter may connect, the stroke curves down the left side, slants down and to the right to a point on the baseline, then climbs the mirrored path up and to the right to the x-height, where it may connect to the next letter.
mono:
  bitmap:
  - "#   #"  #
  - "#   #"
  - "#   #"
  - " # # "
  - " # # "
  - "  #  "  #
stances:
  sole:
    motion: sole
    traits: []
    bitmap:
    - "#   #"  #
    - "#   #"
    - "#   #"
    - " # # "
    - " # # "
    - "  #  "  #
    surface:
      entries:
        x-height:
          x: 0
          stroke: vertical
          from:
          - class: can-exit-at-x-height
            except:
            - {family: qsTea}
            - {family: qsRoe}
      exits:
        x-height:
          x: 5
          stroke: vertical
          unjoined: safe
          toward:
          - family:
            - qsTea
            - qsDay
            - qsDay_qsEat
            - qsDay_qsUtter
            - qsZoo
            - qsJai
            - qsJai_qsUtter
            - qsCheer
            - qsJay
            - qsJay_qsUtter
            - qsYe
            - qsNo
            - qsRoe
            - qsLlan
            - qsIt
            - qsEt
            - qsEight
            - qsAwe
            - qsOx
            - qsOwe
            - qsFoot
      cells: []
      unlocks: []
      require: []
policy:
  order:
  - sole
  refuse: []
  prefer: []
  extend:
  - entry: x-height
    by: 1
    when:
      left:
        family:
        - qsPea
        - qsHe
  - exit: x-height
    by: 1
    when:
      right: {family: qsOwe}
  contract: []
  resolve: []
  groups: {}
kern:
- {right: {family: qsThey}, by: -1}
- {right: {family: qsSee}, by: -1}
- {right: {family: qsSee, stance: straighter}, by: 0}
- {right: {family: qsSee, stance: straightest}, by: 0}
- {right: {family: qsWay}, by: -2}
- {right: {family: qsWay, stance: half}, by: -3}
- {right: {family: qsWhy}, by: -2}
- {right: {family: qsIng}, by: -1}
- {right: {family: qsMay}, by: -1}
- {right: {family: qsMay, stance: grounded-loop}, by: 0}
- {right: {family: qsLow}, by: -1}
- {right: {family: qsAt}, by: -1}
- {right: {family: qsAh}, by: -1}
- {right: {family: qsUtter}, by: -1}
- {right: {family: qsUtter, stance: alternate}, by: 0}
- {right: {family: qsOut}, by: -1}
- {right: {family: qsOut, stance: swept-up}, by: 0}
