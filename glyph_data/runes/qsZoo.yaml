rune: qsZoo
codepoint: 0xE65B
ductus:
  full: |
    Begun at the left of the crown at the x-height, the stroke runs right, curves downward, and descends to the left through the baseline. It curls right along the bottom of the descender and climbs up to the right, ending below the baseline.
  half: |
    Begun at the baseline on the left, the stroke descends into the foot, curls right along the bottom of the descender, and climbs up to the right, ending below the baseline.
mono:
  bitmap:
  - "###  " #
  - "   # "
  - "   # "
  - "  #  "
  - " #   "
  - " #   " #
  - "#   #"
  - "#  # "
  - " ##  "
  y_offset: -3
stances:
  full:
    motion: full
    traits: []
    bitmap:
    - "###  " #
    - "   # "
    - "   # "
    - "  #  "
    - " #   "
    - " #   " #
    - "#   #"
    - "#  # "
    - " ##  "
    y_offset: -3
    surface:
      entries:
        x-height:
          x: 0
          stroke: horizontal
          from:
          - class: can-exit-at-x-height
            except:
            - {family: qsGay}
            - {family: qsThey}
            - {family: qsRoe}
      exits:
        baseline:
          x: 5
          ink_y: -1
          stroke: diagonal
          unjoined: safe
          toward:
          - class: can-enter-at-baseline
            except:
            - {family: qsPea}
      cells: []
      unlocks: []
      require: []
  half:
    motion: half
    traits:
    - half
    bitmap:
    - "     " #
    - "     "
    - "     "
    - "     "
    - "     "
    - "#    " #
    - "#   #"
    - "#  # "
    - " ##  "
    y_offset: -3
    surface:
      entries:
        baseline:
          x: 0
          stroke: vertical
          from:
          - family:
            - qsBay
            - qsTea
            - qsDay
            - qsKey
            - qsGay
            - qsZoo
            - qsShe
            - qsJai
            - qsCheer
            - qsJay
            - qsYe
            - qsIng
            - qsNo
            - qsLlan
            - qsExcite
            - qsIt
            - qsEat
            - qsEt
            - qsEight
            - qsAwe
            - qsOx
            - qsOy
            - qsOoze
      exits:
        baseline:
          x: 5
          ink_y: -1
          stroke: diagonal
          unjoined: safe
          toward:
          - class: can-enter-at-baseline
            except:
            - {family: qsPea}
      cells: []
      unlocks: []
      require: []
policy:
  order:
  - full
  - half
  refuse:
  - exit: baseline
    when:
      left: {family: qsThey}
  prefer:
  - stance: full
    when:
      left: {family: qsTea}
  - cell: {exit: none}
    over: {exit: baseline}
    when:
      right:
        family: qsNo
        then: {family: qsEt}
  extend:
  - stance: full
    entry: x-height
    by: 1
    when:
      left: {family: qsMay}
  contract:
  - stance: full
    entry: x-height
    by: 1
    when:
      left:
        family:
        - qsTea
        - qsHe
  - stance: full
    entry: x-height
    by: 2
    when:
      left:
        family: qsPea
        stance: half
  resolve: []
  groups: {}
