rune: qsOoze
codepoint: 0xE67E
ductus:
  sole: |
    Begun at the bottom left on the baseline, the stroke rises up and then curves back downward in a slightly-pointier-than-parabolic arc that rests on the baseline at the right, where it may connect to the next letter.
mono:
  bitmap:
  - "  #  "  #
  - " # # "
  - " # # "
  - "#   #"
  - "#   #"
  - "#   #"  #
stances:
  sole:
    motion: sole
    traits: []
    bitmap:
    - "  #  "  #
    - " # # "
    - " # # "
    - "#   #"
    - "#   #"
    - "#   #"  #
    surface:
      entries:
        baseline:
          x: 0
          stroke: vertical
          from:
          - class: can-exit-at-baseline
            except:
            - {family: qsThaw}
            - {family: qsVie}
            - {family: qsWay}
            - {family: qsMay}
            - {family: qsRoe}
            - {family: qsAt}
      exits:
        baseline:
          x: 5
          stroke: vertical
          unjoined: safe
          toward:
          - class: can-enter-at-baseline
            except:
            - {family: qsPea}
            - {family: qsGay}
      cells: []
      unlocks: []
      require: []
policy:
  order:
  - sole
  refuse: []
  prefer: []
  extend: []
  contract: []
  resolve: []
  groups: {}
kern:
- {right: {family: qsPea}, by: -2}
- {right: {family: qsGay}, by: -1}
- {right: {family: qsLlan}, by: -1}
- {right: {family: qsEight}, by: -1}
- {right: {family: qsOx}, by: -1}
- {right: {family: qsFoot}, by: -1}
