            - qsEat
            - qsAt
            - qsI
            - qsAh
            - qsUtter
            - qsOut
            - qsOut_qsTea
            - qsOoze
      cells: []
      unlocks: []
      require: []
policy:
  order:
  - sole
  refuse: []
  prefer: []
  extend: []
  contract:
  - exit: baseline
    by: 1
    when:
      right: {family: qsNo}
  resolve: []
  groups: {}
