    traits: []
    bitmap:
    - "    "
    - "  # "
    - "  # "
    - "##  "  #
    - " #  "
    - " #  "
    - "#   "
    - "#   "
    - " ###"  #
    surface:
      entries:
        x-height:
          x: 0
          stroke: horizontal
          from:
          - class: can-exit-at-x-height
            except:
            - {family: qsTea}
            - {family: qsThey}
            - {family: qsWay}
            - {family: qsHe}
            - {family: qsWhy}
            - {family: qsRoe}
