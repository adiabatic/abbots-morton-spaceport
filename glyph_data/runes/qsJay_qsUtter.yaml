rune: qsJay_qsUtter
sequence:
- qsJay
- qsUtter
ductus:
  sole: |
    The ·Jay stroke and the ·Utter stroke drawn as one motion: the ·Jay part as usual along the crown and down through its descender, but instead of ending at the bottom left, the stroke doubles back and climbs diagonally up and to the right, out of the descender and past the baseline, and finishes with ·Utter’s short rightward crown at the x-height, where it may connect to the next letter.
stances:
  sole:
    motion: sole
    outgoing:
      stance: mono
      exceptions: {surface.exits.x-height: The ligature keeps its authored follower scope for its combined stroke.}
    traits: []
    bitmap:
    - "####     ##"  #
    - "    #   #  "
    - "    #  #   "
    - "   #  #    "
    - "  #  #     "
    - " #  #      "  #
    - " # #       "
    - "# #        "
    - "##         "
    y_offset: -3
    surface:
      entries:
        x-height:
          x: 0
          stroke: horizontal
          from:
          - class: can-exit-at-x-height
            except:
            - {family: qsThey}
            - {family: qsRoe}
      exits:
        x-height:
          x: 11
          stroke: horizontal
          toward:
          - {class: can-enter-at-x-height}
      cells: []
      unlocks: []
      require: []
policy:
  order:
  - sole
  refuse: []
  prefer: []
  extend: []
  contract:
  - entry: x-height
    by: 1
    when:
      left:
        family:
        - qsPea
        - qsTea
        - qsHe
  resolve: []
  groups: {}
