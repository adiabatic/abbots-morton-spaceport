rune: qsSee
codepoint: 0xE65A
ductus:
  normal: |
    Begun at the left end of the baseline foot, the stroke runs right along the baseline, rises to the right, snakes back leftward through the waist, and climbs right again into the crest, exiting rightward at the top, where it may connect to the next letter.
  curled-over: |
    As the normal form, but the crest hooks over and down on the right, exiting rightward to connect slightly above the x-height.
  straighter: |
    Begun at the top, the stroke snakes down the spine — leftward through the waist, back out to the right — and then back again to the left a teeny bit by the time it hits the baseline. It may connect to the next letter there.
  straightest: |
    As the straighter form, but the tail finishes straight down onto the baseline.
mono:
  bitmap:
  - "   ##"
  - "  #  "
  - " #   "
  - " #   "  #
  - "  #  "
  - "  #  "
  - "   # "
  - "   # "
  - "###  "  #
stances:
  normal:
    motion: normal
    traits: []
    bitmap:
    - "   ##"
    - "  #  "
    - " #   "
    - " #   "  #
    - "  #  "
    - "  #  "
    - "   # "
    - "   # "
    - "###  "  #
    surface:
      entries:
        baseline:
          x: 0
          stroke: horizontal
      exits:
        top:
          x: 5
          stroke: horizontal
      cells: []
      unlocks: []
      require: []
  curled-over:
    motion: curled-over
    traits: []
    bitmap:
    - "   ## "
    - "  #  #"
    - " #   #"
    - " #    "  #
    - "  #   "
    - "  #   "
    - "   #  "
    - "   #  "
    - "###   "  #
    surface:
      entries:
        baseline:
          x: 0
          stroke: horizontal
      exits:
        y6:
          x: 6
          stroke: vertical
      cells: []
      unlocks: []
      require: []
  straighter:
    motion: straighter
    traits: []
    bitmap:
    - "   #"
    - "  # "
    - " #  "
    - " #  "  #
    - "  # "
    - "  # "
    - "   #"
    - "   #"
    - "  # "  #
    surface:
      entries: {}
      exits:
        baseline:
          x: 3
          stroke: diagonal
          toward:
          - family:
            - qsLow
            - qsAt
      cells: []
      unlocks: []
      require: []
  straightest:
    motion: straightest
    traits: []
    bitmap:
    - "   #"
    - "  # "
    - " #  "
    - " #  "  #
    - "  # "
    - "  # "
    - "   #"
    - "   #"
    - "   #"  #
    surface:
      entries: {}
      exits:
        # This new ·See doesn't work with ·Out like it should — it doesn't even go all the way to the baseline like the old one did. In the rebuild, we should be using `straighter` or `straightest` stances
        baseline:
          x: 4
          stroke: vertical
          toward:
          - family:
            - qsOut
            - qsOut_qsTea
            - qsOoze
      cells: []
      unlocks: []
      require: []
policy:
  order:
  - normal
  - curled-over
  - straighter
  - straightest
  refuse:
  - entry: baseline
    when:
      left: {family: qsYe}
  prefer:
  - cell:
      entry: none
      exit: baseline
    over:
      entry: baseline
      exit: none
    when:
      left:
        class: can-exit-at-baseline
        except:
        - {family: qsIt}
      right:
        family:
        - qsLow
        - qsAt
        - qsOut
        - qsOut_qsTea
        - qsOoze
  extend:
  - stance: straighter
    exit: baseline
    by: 2
    when:
      right: {family: qsLow}
  contract: []
  resolve: []
  groups: {}
