policy:
  order:
  - crested
  - curled
  - grounded
  - grounded-straight
  refuse:
  - entry: baseline
    when:
      left: {family: qsYe}
  prefer:
  - cell:
      entry: none
      exit: baseline
    over:
      entry: baseline
      exit: none
    when:
      left:
        class: can-exit-at-baseline
        except:
        - {family: qsIt}
      right:
        family:
        - qsLow
        - qsAt
        - qsOut
        - qsOoze
  extend:
  - stance: grounded
    exit: baseline
    by: 2
    when:
      right: {family: qsLow}
  contract:
  - stance: grounded
    exit: baseline
    by: 1
    when:
      right: {family: qsOut}
  resolve: []
  groups: {}
