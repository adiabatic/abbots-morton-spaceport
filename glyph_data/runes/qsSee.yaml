rune: qsSee
codepoint: 0xE65A
ductus:
  crested: | # DRAFT — pending author sign-off
    Begun at the left end of the baseline foot, the stroke runs right along the baseline, rises to the right, snakes back leftward through the waist, and climbs right again into the crest, exiting rightward at the top, where it may connect to the next letter.
  curled: | # DRAFT — pending author sign-off
    As the crested form, but the crest hooks over and down on the right, exiting rightward at the top of the Short letters.
  grounded: | # DRAFT — pending author sign-off
    Begun at the top, the stroke snakes down the spine — leftward through the waist, back out to the right — and curls in to rest on the baseline, exiting rightward, where it may connect to the next letter.
  grounded-straight: | # DRAFT — pending author sign-off
    As the grounded form, but the tail finishes straight down onto the baseline.
