rune: qsLlan
codepoint: 0xE66A
ductus:
  sole: |  # DRAFT — pending author sign-off
    Begun at the top left at the x-height, where a previous letter may connect, the stroke drops straight down, angles down and to the right to a short horizontal point at mid-height, doubles back down and to the left, then runs rightward along the baseline to rest at the bottom right, where it may connect to the next letter.
mono:
  bitmap:
  - "#    "  #
  - "#    "
  - " #   "
  - "  ## "
  - " #   "
  - "  ###"  #
