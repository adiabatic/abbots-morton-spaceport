rune: qsLlan
codepoint: 0xE66A
ductus:
  sole: |
    Begun at the top left at the x-height, where a previous letter may connect, the stroke curves down and to the right to a short horizontal point at mid-height, doubles back down and to the left, then runs rightward along the baseline to rest at the bottom right, where it may connect to the next letter.
mono:
  bitmap:
  - "#    "  #
  - "#    "
  - " #   "
  - "  ## "
  - " #   "
  - "  ###"  #
stances:
  sole:
    motion: sole
    traits: []
    bitmap:
    - "#    "  #
    - "#    "
    - " #   "
    - "  ## "
    - " #   "
    - "  ###"  #
    surface:
      entries:
        x-height:
          x: 0
          stroke: vertical
          from:
          - class: can-exit-at-x-height
            except:
            - {family: qsRoe}
      exits:
        baseline:
          x: 5
          stroke: horizontal
          toward:
          - family:
            - qsTea
            - qsDay
            - qsDay_qsUtter
            - qsGay
            - qsThaw
            - qsVie
            - qsSee
            - qsZoo
            - qsYe
            - qsHe
            - qsIng
            - qsMay
            - qsNo
            - qsLow
            - qsRoe
            - qsExcite
            - qsExam
            - qsIt
            - qsEat
            - qsAt
            - qsI
            - qsAh
            - qsUtter
            - qsOut
            - qsOut_qsTea
            - qsOoze
      cells: []
      unlocks: []
      require: []
policy:
  order:
  - sole
  refuse: []
  prefer: []
  extend:
  - entry: x-height
    by: 1
    when:
      left:
        family:
        - qsPea
        - qsTea
        - qsHe
  contract: []
  resolve: []
  groups: {}
