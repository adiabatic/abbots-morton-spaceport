    - "#    "
    - " #   "
    - "  ## "
    - " #   "
    - "  ###"  #
    surface:
      entries:
        x-height:
          x: 0
          stroke: vertical
          from:
          - family:
            - qsPea
            - qsTea
            - qsGay
            - qsThey
            - qsFee
            - qsWay
            - qsHe
            - qsWhy
            - qsMay
