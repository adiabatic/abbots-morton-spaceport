              - qsOx
              - qsUtter
              - qsOwe
              - qsFoot
  extend:
  - entry: x-height
    by: 1
    when:
      left:
        family:
        - qsPea
        - qsTea
        - qsHe
  contract: []
  resolve: []
  groups: {}
