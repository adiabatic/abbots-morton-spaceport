rune: qsEight
codepoint: 0xE673
ductus:
  hapax: |
    Begun at the left along the x-height, the stroke dips down and around in a small counter-clockwise loop under the x-height, closing on itself, then falls from the loop’s underside to the baseline at the right.
mono:
  bitmap:
  - "# ## "  #
  - " #  #"
  - " ### "
  - "  #  "
  - "   # "
  - "    #"  #
stances:
  normal-sized-loop:
    motion: hapax
    traits: []
    bitmap:
    - "# ## "  #
    - " #  #"
    - " ### "
    - "  #  "
    - "   # "
    - "    #"  #
    surface:
      entries:
        x-height:
          x: 0
          stroke: horizontal
          from:
          - family:
            - qsPea
            - qsTea
            - qsDay_qsUtter
            - qsFee
            - qsVie_qsUtter
            - qsSee_qsUtter
            - qsJai_qsUtter
            - qsMay
            - qsNo
            - qsLow
            - qsRoe
            - qsIt
            - qsAt
            - qsI
            - qsAh
            - qsUtter
            - qsOut
      exits:
        baseline:
          x: 5
          stroke: diagonal
          toward:
          - family:
            - qsDay
            - qsDay_qsUtter
            - qsVie
            - qsVie_qsUtter
            - qsSee
            - qsMay
            - qsNo
            - qsLow
            - qsRoe
            - qsAt
            - qsI
            - qsAh
            - qsUtter
            - qsOut
            - qsOut_qsTea
            - qsOoze
      cells: []
      unlocks: []
      require: []
  smaller-loop:
    motion: hapax
    traits: []
    bitmap:
    - "# #  "  #
    - " # # "
    - " ##  "
    - "  #  "
    - "   # "
    - "    #"  #
    surface:
      entries:
        x-height:
          x: 0
          stroke: horizontal
          from:
          - family:
            - qsPea
            - qsTea
            - qsDay_qsUtter
            - qsFee
            - qsVie_qsUtter
            - qsSee_qsUtter
            - qsJai_qsUtter
            - qsMay
            - qsNo
            - qsLow
            - qsRoe
            - qsIt
            - qsAt
            - qsI
            - qsAh
            - qsUtter
            - qsOut
      exits:
        baseline:
          x: 5
          stroke: diagonal
          toward:
          - family:
            - qsTea
            - qsIt
      cells: []
      unlocks: []
      require: []
policy:
  order:
  - normal-sized-loop
  - smaller-loop
  refuse: []
  prefer:
  - cell: {exit: none}
    over: {exit: baseline}
    when:
      right:
        family: qsTea
        then:
          except:
          - {family: qsPea}
  extend:
  - stance: normal-sized-loop
    entry: x-height
    by: 1
    when:
      left:
        family:
        - qsPea
        - qsTea
        - qsHe
  - stance: smaller-loop
    entry: x-height
    by: 1
    when:
      left:
        family:
        - qsPea
        - qsTea
        - qsHe
  - stance: normal-sized-loop
    exit: baseline
    by: 1
    when:
      right:
        family:
        - qsYe
        - qsHe
        - qsExam
  contract: []
  resolve: []
  groups: {}
