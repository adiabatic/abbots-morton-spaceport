rune: qsEight
codepoint: 0xE673
ductus:
  sole: |
    Begun at the left along the x-height, the stroke dips down and around in a small counter-clockwise loop under the x-height, closing on itself, then falls from the loop’s underside to the baseline at the right.
mono:
  bitmap:
  - "# ## "  #
  - " #  #"
  - " ### "
  - "  #  "
  - "   # "
  - "    #"  #
stances:
  normal-sized-loop:
    motion: sole
    traits: []
    bitmap:
    - "# ## "  #
    - " #  #"
    - " ### "
    - "  #  "
    - "   # "
    - "    #"  #
    surface:
      entries:
        x-height:
          x: 0
          stroke: horizontal
          from:
          - {class: can-exit-at-x-height}
      exits:
        baseline:
          x: 5
          stroke: diagonal
          toward:
          - class: can-enter-at-baseline
            except:
            - {family: qsPea}
            - {family: qsTea}
            - {family: qsGay}
            - {family: qsI}
      cells: []
      unlocks: []
      require: []
  smaller-loop:
    motion: sole
    traits: []
    bitmap:
    - "# #  "  #
    - " # # "
    - " ##  "
    - "  #  "
    - "   # "
    - "    #"  #
    surface:
      entries:
        x-height:
          x: 0
          stroke: horizontal
          from:
          - {class: can-exit-at-x-height}
      exits:
        baseline:
          x: 5
          stroke: diagonal
          toward:
          - family:
            - qsTea
            - qsI
      cells: []
      unlocks: []
      require: []
policy:
  order:
  - normal-sized-loop
  - smaller-loop
  refuse: []
  prefer:
  - cell: {exit: none}
    over: {exit: baseline}
    when:
      right:
        family: qsTea
        then:
          except:
          - {family: qsPea}
          - family: qsIt
            then:
              family:
              - qsDay
              - qsDay_qsUtter
              - qsZoo
              - qsJai
              - qsJai_qsUtter
              - qsCheer
              - qsJay
              - qsJay_qsUtter
              - qsRoe
              - qsLlan
              - qsEight
              - qsI
              - qsAwe
              - qsOx
              - qsUtter
              - qsOwe
              - qsFoot
  - cell: {exit: baseline}
    over: {exit: none}
    when:
      right:
        family: qsTea
        then:
          family: qsIt
          then:
            family:
            - qsDay
            - qsDay_qsUtter
            - qsZoo
            - qsJai
            - qsJai_qsUtter
            - qsCheer
            - qsJay
            - qsJay_qsUtter
            - qsRoe
            - qsLlan
            - qsEight
            - qsI
            - qsAwe
            - qsOx
            - qsUtter
            - qsOwe
            - qsFoot
  extend:
  - stance: normal-sized-loop
    exit: baseline
    by: 1
    when:
      right:
        family:
        - qsYe
        - qsHe
        - qsExam
        - qsIt
  contract: []
  resolve: []
  groups: {}
