rune: qsTea_qsOy
sequence:
- qsTea
- qsOy
ductus:
  sole: |
    Written as ·Tea flowing into ·Oy: the vertical bar first, from the top down through the x-height. Without lifting the pen, the small ·Oy loop is drawn clockwise around the foot of the bar, closing on it, and the stroke runs out diagonally down to the right, ending at the baseline, where it may connect to the next letter.
notes: |
  Entryless by declaration: the empty entries map is explicit so the obligation is visible (entry inheritance from the lead ·Tea cannot apply — the ligature's leftmost ink at the lead's entry heights does not match the lead's anchors). Predecessors leave their exits unjoined before this ligature; that is cell semantics on their side, never policy here.
stances:
  sole:
    motion: sole
    outgoing:
      stance: sole
      exceptions: {'policy.prefer[0]': The ligature's authored preference and resolve retain the grouping documented in their why fields.}
      replacements: {'policy.prefer[0]': 'policy.prefer[0]'}
    traits: []
    bitmap:
    - "   #    "
    - "   #    "
    - "   #    "
    - " ####   "  #
    - "#  # #  "
    - "#  #  # "
    - " ##    #"
    - "       #"
    - "       #"  #
    surface:
      entries: {}
      exits:
        baseline:
          x: 8
          stroke: vertical
          unjoined: safe
      cells: []
      unlocks: []
      require: []
policy:
  order:
  - sole
  refuse: []
  prefer:
  - cell: {exit: none}
    over: {exit: baseline}
    when:
      right:
        family:
        - qsTea
        - qsIt
        except:
        - family: qsTea
          then:
            family: qsUtter
            then: {family: qsLow}
        - family: qsTea
          then:
            family: qsUtter
            then:
              family: qsTea
              except:
              - family: qsTea
                then:
                  family:
                  - qsDay
                  - qsDay_qsUtter
                  - qsMay
                  - qsNo
                  - qsLow
                  - qsIt
                  - qsAh
                  - qsUtter
    why: 'This is qsOy.policy.prefer[0], but for the ligature version'
  extend: []
  contract: []
  resolve:
  - against:
      rune: qsIt
      id: withhold-before-no-after-oy
    when:
      right:
        family: qsIt
        then: {family: qsNo}
    pick: {exit: baseline}
    why: |
      Consider ·Tea·Oy·It·No·Ah.

      This is the `oy-it-baseline` grouping, but for ·Tea+Oy.
  groups: {}
