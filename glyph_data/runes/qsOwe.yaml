          stroke: horizontal
          unjoined: safe
          toward:
          - family:
            - qsTea
            - qsFee
            - qsZoo
            - qsJai
            - qsJai_qsUtter
            - qsCheer
            - qsJay
            - qsJay_qsUtter
            - qsYe
            - qsNo
            - qsRoe
            - qsLlan
            - qsIt
            - qsEt
            - qsEight
            - qsAwe
            - qsOx
            - qsOy
            - qsOwe
            - qsFoot
      cells:
