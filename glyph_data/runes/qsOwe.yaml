        exit: x-height
        bitmap: open-on-the-right
      - entry: x-height
        exit: x-height
        bitmap: open-on-both-sides
      unlocks:
      - exit: x-height
        feature: ss07
        when:
          right:
            family:
            - qsDay
            - qsDay_qsEat
            - qsDay_qsUtter
      require: []
