rune: qsRoe
codepoint: 0xE668
ductus:
  hapax: | # DRAFT — pending author sign-off
    - Begun at the left along the x-height, the stroke runs rightward, bends down around a shallow bowl on the right, and comes back leftward along the baseline.
    - Or the same letter drawn the other way round: begun at the left along the baseline, bending up around the bowl and finishing leftward along the x-height.
    - Either way, when the next letter is to be joined the closing arm turns back out to the right instead of stopping short — running under the bowl when the stroke ends at the baseline, and over it when the stroke ends at the x-height.
notes: |
  ·Roe is one stroke between two tips on the left, so whichever tip receives the join, the other is the one that carries on: entering and leaving at the same height is not a shape ·Roe has.
mono:
  bitmap:
  - "###  "  #
  - "   # "
  - "    #"
  - "    #"
  - "   # "
  - "###  "  #
stances:
  hapax:
    motion: hapax
    traits: []
    bitmap:
    - "###  "  #
    - "   # "
    - "    #"
    - "    #"
    - "   # "
    - "###  "  #
    bitmaps:
      reaches-over-the-bowl:
        bitmap:
        - "  ####"  #
        - "    # "
        - "     #"
        - "     #"
        - "    # "
        - "####  "  #
    surface:
      entries:
        baseline:
          x: 0
          stroke: horizontal
        x-height:
          x: 0
          stroke: horizontal
      exits:
        baseline:
          x: 5
          stroke: horizontal
          stub:
            cols: [3, 4]
            inks_when: joined
          toward:
          - family:
            - qsThaw
            - qsVie
            - qsSee
            - qsIng
            - qsMay
            - qsNo
            - qsLow
            - qsRoe
            - qsAt
            - qsI
            - qsAh
        x-height:
          x: 6
          stroke: horizontal
          toward:
          - family:
            - qsJai
            - qsNo
            - qsRoe
            - qsEight
            - qsAwe
            - qsOx
            - qsOy
      pairings:
        never:
        - entry: baseline
          exit: baseline
        - entry: x-height
          exit: x-height
      cells:
      - entry: none
        exit: x-height
        bitmap: reaches-over-the-bowl
      - entry: baseline
        exit: x-height
        bitmap: reaches-over-the-bowl
      unlocks: []
      require: []
policy:
  order:
  - hapax
  refuse: []
  prefer:
  - cell: {entry: x-height}
    over: {exit: x-height}
  - cell: {exit: x-height}
    over: {exit: baseline}
    when:
      self: {entry: none}
      right:
        family:
        - qsNo
        - qsRoe
  extend:
  - entry: baseline
    by: 1
    when:
      left:
        family:
        - qsJay
        - qsYe
        - qsIt
        - qsEat
        - qsEight
  - entry: x-height
    by: 1
    when:
      left:
        family:
        - qsMay
        - qsIt
  - exit: baseline
    by: 1
    when:
      right:
        family:
        - qsLow
        - qsI
  contract:
  - entry: x-height
    by: 1
    when:
      left:
        family:
        - qsPea
        - qsTea
        - qsHe
  resolve: []
  groups: {}
