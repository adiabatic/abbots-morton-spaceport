rune: qsBay
codepoint: 0xE651
ductus:
  sole: |
    Begun at the x-height, the stroke falls straight down past the baseline, loops counterclockwise below it — leftward along the bottom, then up the left side — and closes rightward along the baseline, where it may connect to the next letter.
mono:
  bitmap:
  - "   # "  #
  - "   # "
  - "   # "
  - "   # "
  - "   # "
  - " ####"  #
  - "#  # "
  - "#  # "
  - " ##  "
  y_offset: -3
stances:
  sole:
    motion: sole
    traits: []
    bitmap:
    - "   # "  #
    - "   # "
    - "   # "
    - "   # "
    - "   # "
    - " ####"  #
    - "#  # "
    - "#  # "
    - " ##  "
    y_offset: -3
    surface:
      entries:
        x-height:
          x: 3
          stroke: vertical
          from:
          - family:
            - qsI
            - qsAh
            - qsUtter
      exits:
        baseline:
          x: 5
          stroke: horizontal
          toward:
          - class: can-enter-at-baseline
            except:
            - {family: qsPea}
      cells: []
      unlocks: []
      require: []
policy:
  order:
  - sole
  refuse: []
  prefer: []
  extend: []
  contract:
  - exit: baseline
    by: 1
    when:
      right: {family: qsNo}
  resolve: []
  groups: {}
kern:
- {right: {family: qsPea}, by: -1}
- {right: {family: qsLlan}, by: -1}
- {right: {family: qsEt}, by: -1}
- {right: {family: qsEight}, by: -1}
- {right: {family: qsAwe}, by: -1}
- {right: {family: qsOx}, by: -1}
- {right: {family: qsOy}, by: -1}
- {right: {family: qsFoot}, by: -1}
