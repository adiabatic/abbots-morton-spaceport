rune: qsBay
codepoint: 0xE651
ductus:
  hapax: |
    Begun at the x-height, the stroke falls straight down past the baseline, loops counterclockwise below it — leftward along the bottom, then up the left side — and closes rightward along the baseline, where it may connect to the next letter.
mono:
  bitmap:
  - "   # "  #
  - "   # "
  - "   # "
  - "   # "
  - "   # "
  - " ####"  #
  - "#  # "
  - "#  # "
  - " ##  "
  y_offset: -3
stances:
  hapax:
    motion: hapax
    traits: []
    bitmap:
    - "   # "  #
    - "   # "
    - "   # "
    - "   # "
    - "   # "
    - " ####"  #
    - "#  # "
    - "#  # "
    - " ##  "
    y_offset: -3
    surface:
      entries:
        x-height:
          x: 3
          stroke: vertical
          from:
          - family:
            - qsI
            - qsAh
            - qsUtter
      exits:
        baseline:
          x: 5
          stroke: horizontal
          toward:
          - family:
            - qsTea
            - qsDay
            - qsDay_qsUtter
            - qsVie
            - qsVie_qsUtter
            - qsSee
            - qsMay
            - qsNo
            - qsLow
            - qsRoe
            - qsIt
            - qsAt
            - qsI
            - qsAh
            - qsUtter
            - qsOut
            - qsOut_qsTea
            - qsOoze
      cells: []
      unlocks: []
      require: []
policy:
  order:
  - hapax
  refuse: []
  prefer:
  - cell: {exit: none}
    over: {exit: baseline}
    when:
      right:
        family: qsTea
        then:
          except:
          - {family: qsPea}
  extend: []
  contract: []
  resolve: []
  groups: {}
