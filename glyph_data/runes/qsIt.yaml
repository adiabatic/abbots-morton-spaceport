rune: qsIt
codepoint: 0xE670
ductus:
  hapax: |
    - Either written from top to bottom or bottom to top.
mono:
  bitmap:
  - "  #  "  #
  - "  #  "
  - "  #  "
  - "  #  "
  - "  #  "
  - "  #  "  #
stances:
  hapax:
    motion: hapax
    traits: []
    bitmap:
    - "#"  #
    - "#"
    - "#"
    - "#"
    - "#"
    - "#"  #
    surface:
      entries:
        baseline:
          x: 0
          stroke: vertical
        x-height:
          x: 0
          stroke: vertical
      exits:
        baseline:
          x: 1
          stroke: vertical
          withdrawal: safe
        x-height:
          x: 1
          stroke: vertical
          withdrawal: safe
      pairings:
        only:
        - entry: x-height
          exit: baseline
        - entry: x-height
          exit: none
        - entry: baseline
          exit: x-height
        - entry: baseline
          exit: none
        - entry: none
          exit: x-height
        - entry: none
          exit: baseline
        - entry: none
          exit: none
      cells: []
      unlocks:
      - pairing:
          entry: baseline
          exit: baseline
        feature: ss04
        when:
          left:
            except:
            - {family: qsCheer}
      - pairing:
          entry: baseline
          exit: baseline
        feature: ss04
        when:
          left: {family: qsCheer}
          right:
            except:
            - {family: qsThaw}
        why: When ·It joins at the baseline on both sides after ·Cheer, the first and last letters touch, and that's confusing.
      require: []
policy:
  refuse:
  - entry: x-height
    when:
      left: {family: qsIt}
  - entry: baseline
    when:
      left: {family: qsIt}
    why: ·It never joins to itself. Retires the round-1 entered-it-baseline-join-gain approvals and deliberately forgoes the old font's lone real ·It·It chain (ss04, before ·Utter).
  - exit: x-height
    when:
      right:
        family:
        - qsDay
        - qsDay_qsUtter
  - exit: x-height
    when:
      right: {family: qsEt}
    why: ·It·Et looks weird when joined in this font.
  - exit: x-height
    when:
      self: {entry: none}
      right:
        family:
        - qsZoo
        - qsYe
  - exit: x-height
    when:
      self: {entry: none}
      left: {family: qsOwe}
  - exit: x-height
    when:
      self: {entry: live}
      left:
        family:
        - qsJay
        - qsYe
        - qsIt
        - qsEat
  - exit: baseline
    when:
      self: {entry: none}
      right:
        family:
        - qsTea
        - qsRoe
        - qsIt
    why: Two adjacent verticals joined at the baseline render as one extra-thick stroke.
  - exit: baseline
    when:
      self: {entry: none}
      left:
        family:
        - qsBay
        - qsDay
        - qsGay
        - qsShe
      right:
        except:
        - {family: qsDay}
        - {family: qsDay_qsUtter}
        - {family: qsUtter}
  - exit: baseline
    when:
      self: {entry: none}
      left:
        family:
        - qsShe
        - qsEat
        - qsOwe
      right: {family: qsUtter}
  - exit: baseline
    when:
      self: {entry: live}
      left:
        family: qsDay
        stance: half
      right: {family: qsUtter}
  - entry: x-height
    when:
      left: {family: qsThey}
      right: {family: qsDay}
  prefer:
  - id: withhold-before-no-after-oy
    cell: {exit: none}
    over: {exit: x-height}
    when:
      left:
        family: qsOy
        joined_at: baseline
      right: {family: qsNo}
  - cell:
      entry: none
      exit: baseline
    over:
      entry: baseline
      exit: none
    when:
      left: {family: qsBay}
      right:
        family:
        - qsDay
        - qsDay_qsUtter
        - qsUtter
        except:
        - family: qsUtter
          then:
            family:
            - qsThaw
            - qsVie
            - qsVie_qsUtter
            - qsSee
            - qsMay
            - qsLow
  - cell:
      entry: none
      exit: baseline
    over:
      entry: baseline
      exit: none
    when:
      left: {family: qsKey}
      right:
        family:
        - qsDay
        - qsDay_qsUtter
        - qsThaw
        - qsVie
        - qsVie_qsUtter
        - qsSee
        - qsMay
        - qsNo
        - qsLow
        - qsAt
        - qsI
        - qsAh
        - qsUtter
        - qsOut
        - qsOut_qsTea
        - qsOoze
        except:
        - family: qsAt
          then: {family: qsMay}
        - family: qsUtter
          then:
            family:
            - qsThaw
            - qsVie
            - qsVie_qsUtter
            - qsSee
            - qsMay
            - qsLow
  - cell:
      entry: none
      exit: baseline
    over:
      entry: baseline
      exit: none
    when:
      left: {family: qsGay}
      right:
        family:
        - qsDay
        - qsDay_qsUtter
        - qsUtter
        except:
        - family: qsUtter
          then:
            family:
            - qsThaw
            - qsVie
            - qsVie_qsUtter
            - qsSee
            - qsMay
            - qsLow
  - cell:
      entry: none
      exit: baseline
    over:
      entry: baseline
      exit: none
    when:
      left: {family: qsThey}
      right:
        family:
        - qsDay
        - qsDay_qsUtter
        - qsThaw
        - qsVie
        - qsVie_qsUtter
        - qsSee
        - qsMay
        - qsNo
        - qsLow
        - qsAt
        - qsI
        - qsAh
        - qsUtter
        - qsOut
        - qsOut_qsTea
        - qsOoze
        except:
        - family: qsAt
          then: {family: qsMay}
        - family: qsUtter
          then:
            family:
            - qsThaw
            - qsVie
            - qsVie_qsUtter
            - qsSee
            - qsMay
            - qsLow
  - cell:
      entry: none
      exit: baseline
    over:
      entry: baseline
      exit: none
    when:
      left: {family: qsZoo}
      right:
        family: qsUtter
        except:
        - family: qsUtter
          then:
            family:
            - qsThaw
            - qsVie
            - qsVie_qsUtter
            - qsSee
            - qsMay
            - qsLow
            - qsAt
            - qsI
            - qsAh
            - qsOut
            - qsOut_qsTea
            - qsOoze
  - cell: {exit: baseline}
    over: {exit: x-height}
    mode: absolute
    when:
      left: {family: qsSee}
      right:
        family: qsNo
        then: {family: qsEight}
    why: Required to match what The Manual does
  - cell:
      entry: none
      exit: baseline
    over:
      entry: baseline
      exit: none
    when:
      left: {family: qsCheer}
      right:
        family:
        - qsDay
        - qsDay_qsUtter
        - qsThaw
        - qsVie
        - qsVie_qsUtter
        - qsSee
        - qsZoo
        - qsMay
        - qsNo
        - qsLow
        - qsAt
        - qsI
        - qsAh
        - qsUtter
        - qsOut
        - qsOut_qsTea
        - qsOoze
        except:
        - family: qsAt
          then: {family: qsMay}
        - family: qsUtter
          then:
            family:
            - qsThaw
            - qsVie
            - qsVie_qsUtter
            - qsSee
            - qsMay
            - qsLow
            - qsAt
            - qsI
            - qsAh
            - qsOut
            - qsOut_qsTea
            - qsOoze
  - cell: {exit: baseline}
    over: {exit: x-height}
    mode: absolute
    when:
      self: {entry: none}
      right:
        family: qsNo
        then: {family: qsCheer}
    why: Required to match what The Manual does
  extend:
  - entry: baseline
    by: 1
    when:
      left: {family: qsKey}
  - exit: baseline
    by: 1
    when:
      self: {entry: live}
      left: {joined_at: x-height}
      right:
        except:
        - {family: qsDay}
        - {family: qsDay_qsUtter}
        - {family: qsVie}
        - {family: qsVie_qsUtter}
        - {family: qsMay}
        - {family: qsLow}
        - {family: qsI}
        - {family: qsUtter}
  - exit: baseline
    by: 1
    when:
      right:
        family:
        - qsOwe
  - exit: x-height
    by: 1
    when:
      right:
        family:
        - qsZoo
        - qsJai
        - qsJai_qsUtter
        - qsCheer
        - qsOwe
  contract: []
  resolve: []
  groups: {}
