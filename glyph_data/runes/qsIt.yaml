rune: qsIt
codepoint: 0xE670
ductus:
  hapax: |
    - Either written from top to bottom or bottom to top.
mono:
  bitmap:
  - "  #  "  #
  - "  #  "
  - "  #  "
  - "  #  "
  - "  #  "
  - "  #  "  #
stances:
  hapax:
    motion: hapax
    traits: []
    bitmap:
    - "#"  #
    - "#"
    - "#"
    - "#"
    - "#"
    - "#"  #
    surface:
      entries:
        baseline:
          x: 0
          stroke: vertical
        x-height:
          x: 0
          stroke: vertical
      exits:
        baseline:
          x: 1
          stroke: vertical
          withdrawal: safe
        x-height:
          x: 1
          stroke: vertical
          withdrawal: safe
      pairings:
        only:
        - entry: x-height
          exit: baseline
        - entry: x-height
          exit: none
        - entry: baseline
          exit: x-height
        - entry: baseline
          exit: none
        - entry: none
          exit: x-height
        - entry: none
          exit: baseline
        - entry: none
          exit: none
      cells: []
      unlocks:
      - pairing:
          entry: baseline
          exit: baseline
        feature: ss04
      require: []
policy:
  refuse:
  - entry: x-height
    when:
      left: {family: qsIt}
  - entry: baseline
    when:
      left: {family: qsIt}
    why: ·It never joins to itself. Retires the round-1 entered-it-baseline-join-gain approvals and deliberately forgoes the old font's lone real ·It·It chain (ss04, before ·Utter).
  - exit: x-height
    when:
      right:
        family:
        - qsDay
        - qsDay_qsUtter
  - exit: x-height
    when:
      right: {family: qsEt}
    why: ·It·Et looks weird when joined in this font.
  - exit: x-height
    when:
      self: {entry: none}
      right:
        family:
        - qsZoo
        - qsYe
  - exit: x-height
    when:
      self: {entry: none}
      left: {family: qsOwe}
  - exit: x-height
    when:
      self: {entry: live}
      left:
        family:
        - qsJay
        - qsYe
        - qsIt
        - qsEat
  - exit: baseline
    when:
      self: {entry: none}
      right:
        family:
        - qsTea
        - qsRoe
        - qsIt
    why: Two adjacent verticals joined at the baseline render as one extra-thick stroke.
  - exit: baseline
    when:
      self: {entry: none}
      left:
        family:
        - qsBay
        - qsDay
        - qsGay
        - qsShe
      right:
        except:
        - {family: qsDay}
        - {family: qsDay_qsUtter}
        - {family: qsUtter}
  - exit: baseline
    when:
      self: {entry: none}
      left:
        family:
        - qsZoo
        - qsShe
        - qsEat
        - qsOwe
      right: {family: qsUtter}
  - exit: baseline
    when:
      self: {entry: live}
      left:
        family: qsDay
        stance: half
      right: {family: qsUtter}
  prefer:
  - id: withhold-before-no-after-oy
    cell: {exit: none}
    over: {exit: x-height}
    when:
      left:
        family: qsOy
        joined_at: baseline
      right: {family: qsNo}
  extend:
  - entry: baseline
    by: 1
    when:
      left: {family: qsKey}
  - exit: baseline
    by: 1
    when:
      self: {entry: live}
      left: {joined_at: x-height}
      right:
        except:
        - {family: qsDay}
        - {family: qsDay_qsUtter}
        - {family: qsMay}
        - {family: qsLow}
        - {family: qsI}
        - {family: qsUtter}
  - exit: baseline
    by: 1
    when:
      right:
        family:
        - qsJai
        - qsCheer
        - qsOwe
  - exit: baseline
    by: 1
    when:
      self: {entry: none}
      right:
        family:
        - qsVie
        - qsVie_qsUtter
  - exit: x-height
    by: 1
    when:
      right:
        family:
        - qsZoo
        - qsJai
        - qsCheer
        - qsOwe
  contract: []
  resolve: []
  groups: {}
