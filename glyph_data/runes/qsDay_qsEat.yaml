rune: qsDay_qsEat
sequence:
- qsDay
- qsEat
ductus:
  full: |
    The ·Day downstroke and the ·Eat stroke drawn as one motion: straight down the left from the x-height into the descender, hooking out of the foot and rising diagonally up and to the right to the x-height, then straight down the right side to rest on the baseline, where it may connect to the next letter.
  half: |
    As the full ligature, but begun from the ·Day foot hook at the baseline, then rising across to the x-height and straight down the right side to the baseline exit.
stances:
  full:
    motion: full
    outgoing: {stance: sole}
    traits: []
    bitmap:
    - "#    #"  #
    - "#   ##"
    - "#  # #"
    - "#  # #"
    - "# #  #"
    - "# #  #"  #
    - "##    "
    - "##    "
    - "#     "
    y_offset: -3
    surface:
      entries:
        x-height:
          x: 0
          stroke: vertical
      exits:
        baseline:
          x: 6
          stroke: vertical
          unjoined: safe
      cells: []
      unlocks: []
      require: []
  half:
    motion: half
    outgoing: {stance: sole}
    traits:
    - half
    bitmap:
    - "     #"  #
    - "    ##"
    - "   # #"
    - "   # #"
    - "  #  #"
    - "# #  #"  #
    - "##    "
    - "##    "
    - "#     "
    y_offset: -3
    surface:
      entries:
        baseline:
          x: 0
          stroke: diagonal
      exits:
        baseline:
          x: 6
          stroke: vertical
          unjoined: safe
      cells: []
      unlocks: []
      require: []
policy:
  order:
  - full
  - half
  refuse: []
  prefer: []
  extend: []
  contract: []
  resolve: []
  groups: {}
