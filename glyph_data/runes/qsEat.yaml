    motion: sole
    traits: []
    bitmap:
    - "   #"  #
    - "  ##"
    - " # #"
    - " # #"
    - "#  #"
    - "#  #"  #
    surface:
      entries:
        baseline:
          x: 0
          stroke: diagonal
          from:
          - family:
            - qsPea
            - qsBay
            - qsTea
            - qsDay
            - qsKey
            - qsGay
            - qsZoo
            - qsShe
            - qsJai
            - qsCheer
            - qsJay
            - qsYe
